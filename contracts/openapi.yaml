openapi: 3.1.0
info:
  title: Shelf API
  version: 0.1.0
  description: |
    HTTP API of Shelf. Same under HomersLab and standalone. Authentication: HomersLab forwarded identity
    (`X-HomersLab-Person`, trusted only from the configured proxy address) or a standalone passkey session cookie.
    `/shares` also takes a per-person share token (`Authorization: Bearer`), which is good for nothing else.
    Secrets (tokens, the mail password, the delivery address) never appear in a response, except a new
    share token once, in the response that creates it. See ADR 0009 and docs/security.md.
    Money is in centimes (integer). Dates are ISO-8601.
servers: [{ url: /api }]
security: [ { homerslabPerson: [] }, { session: [] } ]
tags: [{name: auth}, {name: household}, {name: month}, {name: backlog}, {name: brain}, {name: library}, {name: inbox}, {name: orders}, {name: settings}, {name: system}]

paths:
  /health:
    get: { tags: [system], operationId: health, security: [], responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { ok: {type: boolean}, version: {type: string}, mode: {enum: [homerslab, standalone]} } } } } } } }

  /me:
    get: { tags: [system], operationId: me, responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Current person and household, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } } } }

  /auth/session:
    get: { tags: [auth], operationId: authSession, security: [], summary: 'Who is signed in, and whether the household still needs its first admin', responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } } } }
  /auth/enrol/options:
    post:
      tags: [auth]
      operationId: enrolOptions
      security: []
      summary: 'Standalone: start enrolling a passkey with a one-time link (the first admin''s setup link, or an invite)'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], additionalProperties: false, properties: { token: { type: string, maxLength: 200 }, name: { type: string, minLength: 1, maxLength: 60, description: 'setup links only: the first admin''s name' } } } } } }
      responses: { '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: WebAuthn registration options, content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnStart' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { description: 'The link is unknown, used or expired', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: 'Not in homerslab mode (HomersLab signs people in)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '429': { description: Too many attempts, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /auth/enrol/verify:
    post:
      tags: [auth]
      operationId: enrolVerify
      security: []
      summary: 'Standalone: finish enrolling; signs the person in (sets the session cookie)'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnFinish' } } } }
      responses: { '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Signed in, headers: { Set-Cookie: { schema: { type: string }, description: 'shelf_session; HttpOnly; Secure; SameSite=Strict; Path=/' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { description: 'Verification failed, or the challenge expired', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'This passkey is already enrolled', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: Not in homerslab mode, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '429': { description: Too many attempts, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /auth/sign-in/options:
    post:
      tags: [auth]
      operationId: signInOptions
      security: []
      summary: 'Standalone: start a passkey sign-in (discoverable credentials; user verification required)'
      responses: { '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: WebAuthn authentication options, content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnStart' } } } }, '404': { description: Not in homerslab mode, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '429': { description: Too many attempts, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /auth/sign-in/verify:
    post:
      tags: [auth]
      operationId: signInVerify
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnFinish' } } } }
      responses: { '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Signed in, headers: { Set-Cookie: { schema: { type: string }, description: 'shelf_session; HttpOnly; Secure; SameSite=Strict; Path=/' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { description: 'Verification failed, an unknown passkey, or a kid''s account', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: Not in homerslab mode, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '429': { description: Too many attempts, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /auth/sign-out:
    post: { tags: [auth], operationId: signOut, security: [], summary: Ends this browser's session (if any) and clears the cookie, responses: { '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Signed out } } }

  /people:
    post:
      tags: [household]
      operationId: addPerson
      summary: 'Admins, standalone: add an adult, an admin or a kid (under HomersLab, people come from HomersLab)'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PersonInput' } } } }
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The handle is taken, or the household is managed by HomersLab', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /people/{personId}:
    parameters: [{ name: personId, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [household]
      operationId: editPerson
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PersonPatch' } } } }
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such person, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The last admin cannot stop being one; the handle is taken; or managed by HomersLab', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
    delete:
      tags: [household]
      operationId: removePerson
      summary: 'Admins, standalone: remove a person with their readings, passkeys and sessions'
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Removed }, '404': { description: No such person, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'Not yourself, not the last admin; or managed by HomersLab', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /people/{personId}/invites:
    parameters: [{ name: personId, in: path, required: true, schema: { type: string } }]
    post:
      tags: [household]
      operationId: invitePerson
      summary: 'Admins, standalone: a one-time link (7 days) for an adult''s first passkey; the link is in this response only. Needs a sign-in in the last 10 minutes (403 otherwise). People who have a passkey add more themselves (/me/passkeys/invite).'
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '201': { description: Created, content: { application/json: { schema: { type: object, required: [url, expiresAt], properties: { url: { type: string }, expiresAt: { type: string } } } } } }, '404': { description: No such person, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'Kids never sign in; the person already has a passkey; or managed by HomersLab', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /me/passkeys:
    get: { tags: [auth], operationId: myPasskeys, responses: { '404': { description: 'Not under HomersLab (HomersLab holds the passkeys)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Passkey' } } } } } } }
  /me/passkeys/invite:
    post: { tags: [auth], operationId: inviteMyself, summary: 'Standalone: a one-time link (24 hours) to add a passkey on another device for yourself; the link is in this response only. Needs a sign-in in the last 10 minutes (403 otherwise).', responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '201': { description: Created, content: { application/json: { schema: { type: object, required: [url, expiresAt], properties: { url: { type: string }, expiresAt: { type: string } } } } } }, '404': { description: Not under HomersLab, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } } }
  /me/sessions/end:
    post: { tags: [auth], operationId: signOutEverywhere, summary: 'Standalone: ends every session of yours, this one too', responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Signed out everywhere }, '404': { description: Not under HomersLab, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } } }
  /me/passkeys/{id}:
    delete: { tags: [auth], operationId: removePasskey, summary: 'Removes one of your passkeys and ends the sessions it signed in', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Removed }, '404': { description: 'No such passkey of yours; or under HomersLab', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: Your last passkey stays, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } } }

  /month:
    get:
      tags: [month]
      operationId: getCurrentMonth
      summary: 'This month''s plan, in the household''s time zone (SHELF_TZ): the one source of "this month" for the page and for add_to_month.'
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MonthPlan' } } } } }
  /month/{month}:
    parameters: [{ name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
    get:
      tags: [month]
      operationId: getMonth
      summary: 'This month or the next (or a month with an order): the picks (packages/scoring, spec §5), budget, the viewer''s focus and the order''s progress. Computed on each look until someone changes it; then kept as the month''s order.'
      responses: { '404': { description: 'Not this month or the next (changes); no plan for that month (a look)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MonthPlan' } } } } }
  /month/{month}/budget:
    parameters: [{ name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
    put:
      tags: [month]
      operationId: setMonthBudget
      summary: 'Admins: this month only (null goes back to the household''s budget). The adults'' picks stay; the kids'' are made again within the range.'
      requestBody: { required: true, content: { application/json: { schema: { oneOf: [ { type: object, required: [min, max], additionalProperties: false, properties: { min: { $ref: '#/components/schemas/Money' }, max: { $ref: '#/components/schemas/Money' } } }, { type: 'null' } ] } } } }
      responses: { '404': { description: 'Not this month or the next (changes); no plan for that month (a look)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The bookshop has the order already', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Recomputed plan, content: { application/json: { schema: { $ref: '#/components/schemas/MonthPlan' } } } } }
  /month/{month}/picks:
    parameters: [{ name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
    post:
      tags: [month]
      operationId: changePicks
      summary: 'Add or remove picks (your own and the kids''; another adult''s: 403), or start again from the scoring (recompute). A change after Compose needs Compose again.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, minProperties: 1, properties: { add: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/PickRef' } }, remove: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/PickRef' } }, recompute: { type: boolean } } } } } }
      responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: 'No open candidate for that person and book; or not this month or the next', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The bookshop has the order already', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MonthPlan' } } } } }

  /backlog:
    get:
      tags: [backlog]
      operationId: listBacklog
      summary: 'GitHub-style filtered list (grammar in contracts/backlog-query.md), scored by packages/scoring. The backlog is shared: every adult sees every candidate.'
      parameters:
        - { name: q, in: query, schema: { type: string, default: 'is:open sort:score' }, example: 'is:open is:adult move:deepen price:<30 sort:score' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '400': { description: 'A q over 500 characters or a limit outside 1 to 200 (bad qualifiers are queryErrors, not 400)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items, counts, facets, nextCursor, queryErrors], properties: {
            items: { type: array, items: { $ref: '#/components/schemas/Candidate' } },
            counts: { type: object, properties: { open: {type: integer}, closed: {type: integer} } },
            facets: { type: object, additionalProperties: { type: array, items: { type: object, properties: { value: {type: string}, count: {type: integer} } } } },
            nextCursor: { type: [string, 'null'] },
            queryErrors: { type: array, items: { type: string } } } } } }
    post:
      tags: [backlog]
      operationId: addToBacklog
      summary: 'A book by hand, for yourself or a kid (adults act for kids); another adult''s backlog is theirs (403)'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title], additionalProperties: false, properties: { title: { type: string, maxLength: 300 }, author: { type: string, maxLength: 200 }, isbn13: { type: string, pattern: '^97[89]\d{10}$' }, for: { type: string, description: 'a handle, or me (the default)' } } } } } }
      responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No one has that handle, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: Already in that backlog, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Candidate' } } } } }
  /backlog/bulk:
    post:
      tags: [backlog]
      operationId: bulkBacklog
      summary: 'All or nothing, on your own candidates and the kids'' (403 if any is another adult''s). add_to_month adds them to this month''s picks (up to 50).'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids, action], properties: { ids: { type: array, minItems: 1, maxItems: 200, items: {type: string} }, action: { enum: [not_for_me, snooze, reopen, add_to_month] }, months: { type: integer, minimum: 1, maximum: 24, default: 3 } } } } } }
      responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such candidate or person, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: object, required: [changed], properties: { changed: {type: integer} } } } } } }
  /backlog/saved-filters:
    get: { tags: [backlog], operationId: savedFilters, responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { id: {type: string}, name: {type: string}, q: {type: string} } } } } } } } }
    post: { tags: [backlog], operationId: saveFilter, summary: 'Saves one of your filters (your list starts from the defaults; at most 20)', requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, q], additionalProperties: false, properties: { name: { type: string, maxLength: 40 }, q: { type: string, maxLength: 500 } } } } } }, responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: Twenty saved already, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '201': { description: Created } } }

  /backlog/saved-filters/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, maxLength: 100 } }]
    patch: { tags: [backlog], operationId: renameFilter, summary: 'Renames one of your saved filters (a default too: your list starts from them)', requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], additionalProperties: false, properties: { name: { type: string, maxLength: 40 } } } } } }, responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such saved filter of yours, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Renamed } } }
    delete: { tags: [backlog], operationId: removeFilter, summary: 'Removes one of your saved filters (an empty list shows the defaults again)', responses: { '404': { description: No such saved filter of yours, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Removed } } }

  /people/{personId}/brain:
    parameters: [{ name: personId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [brain]
      operationId: getBrain
      summary: 'An adult''s ideas (read books per layer, the best open candidate per layer) and the edges between ideas. Every adult may look; kids have an emotional map instead (404).'
      responses: { '404': { description: 'No such person, or a kid', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Ideas, layers, edges, content: { application/json: { schema: { $ref: '#/components/schemas/Brain' } } } } }
  /proposals:
    get:
      tags: [brain]
      operationId: listProposals
      summary: 'Links and book ideas waiting for a person''s decision (book ideas on a merged idea show its new name and keep their own idea id for the review). A proposal written from someone''s takeaways is theirs alone: nobody else sees it here (shelf#3).'
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Proposals' } } } } }
  /links/{fromBook}/{toBook}:
    parameters: [{ name: fromBook, in: path, required: true, schema: {type: string} }, { name: toBook, in: path, required: true, schema: {type: string} }]
    put:
      tags: [brain]
      operationId: reviewLink
      summary: 'A person confirms or rejects a link (the reviewer is recorded). One written from someone''s takeaways is theirs alone: for anyone else it does not exist (404).'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [state], additionalProperties: false, properties: { state: { enum: [confirmed, rejected] } } } } } }
      responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such link, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: object, required: [state, reason], properties: { state: { enum: [confirmed, rejected] }, reason: {type: string} } } } } } }
  /books/{bookId}/ideas/{ideaId}:
    parameters: [{ name: bookId, in: path, required: true, schema: {type: string} }, { name: ideaId, in: path, required: true, schema: {type: string} }]
    put:
      tags: [brain]
      operationId: reviewBookIdea
      summary: 'A person confirms or rejects a book''s idea, or moves it to another layer (which confirms it). Same privacy as links.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, minProperties: 1, additionalProperties: false, properties: { state: { enum: [confirmed, rejected] }, layer: { $ref: '#/components/schemas/Layer' } } } } } }
      responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such idea on that book, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: object, required: [state, layer], properties: { state: { enum: [confirmed, rejected] }, layer: { $ref: '#/components/schemas/Layer' } } } } } } }
  /ideas/{ideaId}:
    parameters: [{ name: ideaId, in: path, required: true, schema: {type: string} }]
    patch:
      tags: [brain]
      operationId: editIdea
      summary: 'Rename an idea, or merge it into another (the household''s shared vocabulary, ADR 0005): either name or mergeInto. Any adult may merge; a merge changes no book''s rows (it decides nothing, private proposals stay their owner''s) and is logged for an admin''s undo.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, minProperties: 1, maxProperties: 1, additionalProperties: false, properties: { name: { type: string, minLength: 1, maxLength: 60 }, mergeInto: {type: string} } } } } }
      responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such idea, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: Another idea has that name, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: 'The idea (after a merge, the one it went into)', content: { application/json: { schema: { type: object, required: [id, name], properties: { id: {type: string}, name: {type: string} } } } } } }
  /ideas/merges:
    get:
      tags: [brain]
      operationId: listMerges
      summary: 'The merge log, newest first: which idea went into which, who merged it and when, and whether it was undone'
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, required: [id, idea, into, mergedBy, mergedAt, undone], properties: { id: {type: string}, idea: { $ref: '#/components/schemas/IdeaRef' }, into: { $ref: '#/components/schemas/IdeaRef' }, mergedBy: { type: [string, 'null'] }, mergedAt: {type: string}, undone: {type: boolean} } } } } } } }
  /ideas/merges/{mergeId}/undo:
    parameters: [{ name: mergeId, in: path, required: true, schema: {type: string} }]
    post:
      tags: [brain]
      operationId: undoMerge
      summary: 'Admins: undo a merge (the idea stands on its own again, with the ideas the merge re-pointed). A merge never changed a row, so nothing else needs restoring.'
      responses: { '404': { description: No such merge, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'Already undone, or the idea has been merged again since', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: The idea, content: { application/json: { schema: { $ref: '#/components/schemas/IdeaRef' } } } } }

  /people/{personId}/library:
    parameters: [{ name: personId, in: path, required: true, schema: { type: string } }]
    get: { tags: [library], operationId: getLibrary, summary: 'A person''s library: owned books of their audience and every book they have a status for. Another adult''s takeaways are never included.', responses: { '404': { description: No such person, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Library' } } } } } }
  /people/{personId}/reading/{bookId}:
    parameters: [{ name: personId, in: path, required: true, schema: {type: string} }, { name: bookId, in: path, required: true, schema: {type: string} }]
    put:
      tags: [library]
      operationId: setReading
      summary: 'Your own status and takeaway, or a kid''s status and feedback (adults act for kids). Not another adult''s (403).'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReadingUpdate' } } } }
      responses: { '400': { description: 'Bad request: a takeaway for a kid, feedback for an adult, or an invalid value', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such person or book, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Reading' } } } } }

  /inbox:
    get: { tags: [inbox], operationId: getInbox, parameters: [{ name: filter, in: query, schema: { enum: [all, ai, shared] } }], responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InboxItem' } } } } } } }
  /inbox/{itemId}/books/{index}:
    parameters: [{ name: itemId, in: path, required: true, schema: {type: string} }, { name: index, in: path, required: true, schema: {type: integer} }]
    post:
      tags: [inbox]
      operationId: decideFound
      requestBody: { content: { application/json: { schema: { type: object, properties: { action: { enum: [add, skip] }, for: {type: string} } } } } }
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK } }
  /shares:
    post:
      tags: [inbox]
      operationId: createShare
      security: [ { homerslabPerson: [] }, { session: [] }, { shareToken: [] } ]
      summary: Phone share target (PWA share_target, or an iOS Shortcut with a per-person share token)
      requestBody:
        content:
          multipart/form-data: { schema: { type: object, properties: { url: {type: string}, text: {type: string}, note: {type: string}, media: { type: array, items: { type: string, format: binary } } } } }
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '202': { description: Accepted, content: { application/json: { schema: { type: object, properties: { id: {type: string}, status: { enum: [received, reading] } } } } } }, '413': { description: 'Too many files (more than 30) or a file over 20 MB', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /share-tokens:
    get: { tags: [inbox], operationId: listShareTokens, summary: The current person's share tokens (never the token itself), responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShareToken' } } } } } } }
    post:
      tags: [inbox]
      operationId: createShareToken
      summary: A new share token for the current person; the token is in this response only, and stored hashed
      requestBody: { content: { application/json: { schema: { type: object, required: [label], properties: { label: {type: string, maxLength: 60} } } } } }
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '201': { description: Created, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ShareToken' }, { type: object, required: [token], properties: { token: {type: string} } } ] } } } } }
  /share-tokens/{id}:
    delete: { tags: [inbox], operationId: revokeShareToken, parameters: [{ name: id, in: path, required: true, schema: {type: string} }], responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Revoked } } }
  /shares/{id}:
    get: { tags: [inbox], operationId: getShare, parameters: [{ name: id, in: path, required: true, schema: {type: string} }], responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Progress and result, content: { application/json: { schema: { $ref: '#/components/schemas/Share' } } } } } }

  /orders:
    post:
      tags: [orders]
      operationId: createOrderDraft
      summary: 'Turn the month''s picks into an order and its Compose link, a mailto with the text filled in (Shelf never sends mail; the text asks for a quote and never holds a card number). The month defaults to the current one.'
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, properties: { month: { type: string, pattern: '^\d{4}-\d{2}$' } } } } } }
      responses: { '404': { description: 'Not this month or the next (changes); no plan for that month (a look)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'No bookshop address yet, nothing picked, or the bookshop has the order already', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } } }
  /orders/{id}:
    get: { tags: [orders], operationId: getOrder, parameters: [{ name: id, in: path, required: true, schema: {type: string} }], responses: { '404': { description: No such order, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } } } }

  /settings:
    get: { tags: [settings], operationId: getSettings, responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } } } }
    patch: { tags: [settings], operationId: patchSettings, summary: '`person` (your own settings) is stored, and the household''s `budget` and `order` (admins, 403 for others); the other household parts answer 400 until their screens store them. `order` needs the sealing key (409 without it).', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }, responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: No sealing key, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK } } }
  /jobs/{job}/run:
    post: { tags: [system], operationId: runJob, description: 'Admins only. prices, metadata and covers run now in the background (job_run keeps how it went); the others arrive with their slices and change nothing yet.', parameters: [{ name: job, in: path, required: true, schema: { enum: [monthly, mail, shares, prices, metadata, covers, ai_suggest] } }, { name: again, in: query, required: false, schema: { enum: ['true', 'false'] }, description: 'metadata: look up every book again, not only those never looked up' }], responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '202': { description: Started, content: { application/json: { schema: { type: object, properties: { id: { type: string, description: 'the job_run row' } } } } } }, '409': { description: 'That job is running already', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } } }

components:
  securitySchemes:
    homerslabPerson: { type: apiKey, in: header, name: X-HomersLab-Person, description: 'SHELF_MODE=homerslab: the person id forwarded by the HomersLab proxy, with X-HomersLab-Name and X-HomersLab-Role (admin, adult or kid); all three are trusted only from SHELF_TRUSTED_PROXY' }
    session: { type: apiKey, in: cookie, name: shelf_session, description: 'SHELF_MODE=standalone: the session cookie of a passkey sign-in. Requests that change something must also carry an Origin header equal to SHELF_ORIGIN.' }
    shareToken: { type: http, scheme: bearer, description: 'A per-person phone share token: accepted by POST /shares and nothing else' }
  responses:
    Unauthorized: { description: 'No valid identity for this route (deny by default)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: 'Not allowed: a kid (kids have no access), someone HomersLab sends without a role, a non-admin on an admin route, or a request that changes something from another origin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error: { type: object, required: [error], properties: { error: {type: string} } }
    Money: { type: integer, description: centimes }
    Me: { type: object, properties: { person: { $ref: '#/components/schemas/Person' }, household: { type: array, items: { $ref: '#/components/schemas/Person' } }, mode: { enum: [homerslab, standalone] } } }
    Person: { type: object, required: [id, name, role], properties: { id: {type: string}, name: {type: string}, role: { enum: [admin, adult, kid] }, handle: { type: [string, 'null'] }, birthYear: { type: [integer, 'null'], description: kids only }, ageBand: { enum: ['0-2','3-5','6-8','9-12', null] }, signsIn: { type: boolean, description: 'standalone: has at least one passkey' } } }
    PersonInput: { type: object, required: [name, role], additionalProperties: false, properties: { name: { type: string, minLength: 1, maxLength: 60 }, role: { enum: [admin, adult, kid] }, handle: { type: string, pattern: '^[a-z][a-z0-9-]{0,19}$' }, birthYear: { type: integer, minimum: 2000, maximum: 2100 } } }
    PersonPatch: { type: object, additionalProperties: false, properties: { name: { type: string, minLength: 1, maxLength: 60 }, role: { enum: [admin, adult, kid] }, handle: { type: [string, 'null'], pattern: '^[a-z][a-z0-9-]{0,19}$' }, birthYear: { type: [integer, 'null'], minimum: 2000, maximum: 2100 } } }
    AuthSession: { type: object, required: [mode, signedIn, setupNeeded], properties: { mode: { enum: [homerslab, standalone] }, signedIn: {type: boolean}, setupNeeded: { type: boolean, description: 'standalone: no admin has a passkey yet; the setup link is in SHELF_DATA_DIR/setup-link.txt' }, person: { $ref: '#/components/schemas/Person' } } }
    WebAuthnStart: { type: object, required: [challengeId, options], properties: { challengeId: {type: string}, options: { type: object, description: 'PublicKeyCredentialCreationOptionsJSON or PublicKeyCredentialRequestOptionsJSON' }, person: { type: object, properties: { name: {type: string} }, description: 'enrol: who the link is for' } } }
    WebAuthnFinish: { type: object, required: [challengeId, response], additionalProperties: false, properties: { challengeId: { type: string, maxLength: 100 }, response: { type: object, description: 'RegistrationResponseJSON or AuthenticationResponseJSON' }, label: { type: string, maxLength: 40, description: 'enrol: a name for this passkey, e.g. Laptop' } } }
    Passkey: { type: object, required: [id, label, createdAt], properties: { id: {type: string}, label: {type: string}, createdAt: {type: string}, lastUsedAt: { type: [string, 'null'] }, backedUp: {type: boolean}, invitedBy: { type: [string, 'null'], description: 'the name of the admin whose invite made it; null for your own or the setup link' } } }
    Budget: { type: object, properties: { min: { $ref: '#/components/schemas/Money' }, max: { $ref: '#/components/schemas/Money' } } }
    BookRef: { type: object, required: [id, title], properties: { id: {type: string}, title: {type: string}, authors: { type: array, items: {type: string} }, coverUrl: {type: string}, isbn13: {type: string}, isFiction: {type: boolean}, audience: { enum: [adult, kids] } } }
    Move: { enum: [deepen, connect, broaden, counterpoint, wildcard, intro, fiction] }
    ScorePart: { type: object, properties: { label: {type: string}, value: {type: number}, kind: {type: string} } }
    Candidate:
      type: object
      properties:
        id: {type: string}
        book: { $ref: '#/components/schemas/BookRef' }
        for: { $ref: '#/components/schemas/Person' }
        state: { enum: [open, closed] }
        closedReason: { enum: [not_for_me, snoozed, owned, repeats, picked, null] }
        move: { $ref: '#/components/schemas/Move' }
        ideas: { type: array, items: { type: object, properties: { id: {type: string}, name: {type: string}, layer: { enum: [intro, core, deep, counterpoint] } } } }
        theme: { type: [string, 'null'] }
        buildsOn: { type: array, items: { type: object, properties: { book: { $ref: '#/components/schemas/BookRef' }, reason: {type: string}, confidence: {type: number}, state: { enum: [proposed, confirmed] } } } }
        source: { enum: [wishlist, to_buy, share, ai, manual, seed] }
        addedAt: { type: string, format: date-time }
        price: { $ref: '#/components/schemas/Money' }
        priceIsEstimate: {type: boolean}
        score: { type: number, description: 'absent when excluded (an adult candidate over the price limit)' }
        scoreParts: { type: array, items: { $ref: '#/components/schemas/ScorePart' } }
    PickRef: { type: object, required: [bookId, for], properties: { bookId: {type: string}, for: {type: string} } }
    Pick:
      type: object
      properties: { candidate: { $ref: '#/components/schemas/Candidate' }, move: { $ref: '#/components/schemas/Move' }, why: {type: string}, idea: {type: string} }
    MonthPlan:
      type: object
      properties:
        month: {type: string}
        budget: { $ref: '#/components/schemas/Budget' }
        budgetIsOverride: {type: boolean}
        total: { $ref: '#/components/schemas/Money' }
        adults: { type: array, items: { type: object, properties: { person: { $ref: '#/components/schemas/Person' }, picks: { type: array, items: { $ref: '#/components/schemas/Pick' } }, unreadPile: {type: integer}, unreadLimit: {type: integer} } } }
        kids: { type: array, items: { type: object, properties: { person: { $ref: '#/components/schemas/Person' }, picks: { type: array, items: { $ref: '#/components/schemas/Pick' } } } } }
        focus: { type: array, items: { type: object, properties: { move: { $ref: '#/components/schemas/Move' }, ideas: { type: array, items: {type: string} }, bookId: {type: string}, sentence: {type: string} } } }
        nextBroaden: { type: [object, 'null'], properties: { month: {type: string}, idea: {type: string}, bookId: {type: string} } }
        order: { oneOf: [ { $ref: '#/components/schemas/Order' }, { type: 'null' } ] }
    Layer: { enum: [intro, core, deep, counterpoint] }
    IdeaRef: { type: object, required: [id, name], properties: { id: {type: string}, name: {type: string} } }
    Proposals:
      type: object
      required: [links, ideas]
      properties:
        links: { type: array, items: { type: object, required: [from, to, reason, confidence, fromAi, onlyYou], properties: { from: { $ref: '#/components/schemas/BookRef' }, to: { $ref: '#/components/schemas/BookRef' }, reason: {type: string}, confidence: {type: number}, fromAi: {type: boolean}, onlyYou: { type: boolean, description: 'written from your own takeaways: nobody else sees it' } } } }
        ideas: { type: array, items: { type: object, required: [book, idea, layer, confidence, fromAi, onlyYou], properties: { book: { $ref: '#/components/schemas/BookRef' }, idea: { type: object, required: [id, name], properties: { id: {type: string}, name: {type: string} } }, layer: { $ref: '#/components/schemas/Layer' }, confidence: {type: number}, fromAi: {type: boolean}, onlyYou: { type: boolean, description: 'written from your own takeaways: nobody else sees it' } } } }
    Brain:
      type: object
      required: [ideas, edges]
      properties:
        ideas: { type: array, items: { type: object, required: [id, name, readCount, unreadOwned, isNew, layers], properties: { id: {type: string}, name: {type: string}, readCount: {type: integer}, unreadOwned: {type: integer}, isNew: {type: boolean}, focus: { $ref: '#/components/schemas/Move' },
          layers: { type: object, additionalProperties: { type: object, properties: { books: { type: array, items: { $ref: '#/components/schemas/BookRef' } }, next: { oneOf: [ { $ref: '#/components/schemas/BookRef' }, { type: 'null' } ] } } } } } } }
        edges: { type: array, items: { type: object, properties: { a: {type: string}, b: {type: string}, weight: {type: integer}, via: { type: array, items: {type: string} }, kind: { enum: [read, gap, focus, future] } } } }
    Reading: { type: object, properties: { status: { enum: [to_read, reading, read, abandoned] }, feedback: { enum: [loved, meh, not_yet, null] }, takeaway: { type: [string, 'null'], maxLength: 280 }, finishedAt: { type: [string, 'null'] } } }
    ReadingUpdate: { type: object, additionalProperties: false, properties: { status: { enum: [to_read, reading, read, abandoned] }, feedback: { enum: [loved, meh, not_yet, null] }, takeaway: { type: [string, 'null'], maxLength: 280 }, finishedAt: { type: [string, 'null'], pattern: '^\d{4}-\d{2}-\d{2}$' } } }
    Library:
      type: object
      required: [person, books, stats]
      properties:
        person: { $ref: '#/components/schemas/Person' }
        books: { type: array, items: { type: object, required: [book, reading], properties: { book: { $ref: '#/components/schemas/BookRef' }, reading: { $ref: '#/components/schemas/Reading' }, ideas: { type: array, items: {type: string} }, themes: { type: array, maxItems: 2, items: {type: string}, description: 'kids'' books: one or two themes (spec §3)' } } } }
        stats: { type: object, properties: { read: {type: integer}, reading: {type: integer}, unreadPile: {type: integer}, unreadLimit: {type: integer}, takeaways: {type: integer} } }
        themes: { type: array, items: { type: object, properties: { theme: {type: string}, books: {type: integer}, loved: {type: integer} } } }
    InboxItem:
      type: object
      properties:
        id: {type: string}
        kind: { enum: [share, ai_suggestion, unmatched_invoice_line] }
        by: { $ref: '#/components/schemas/Person' }
        title: {type: string}
        createdAt: {type: string}
        mediaCount: {type: integer}
        found: { type: array, items: { type: object, properties: { title: {type: string}, author: {type: string}, verdict: { enum: [add, skip_off_theme, skip_owned, fiction] }, idea: {type: string}, layer: {type: string}, theme: {type: string}, buildsOn: { type: array, items: {type: string} }, decided: { enum: [added, skipped, null] } } } }
    Share: { type: object, properties: { id: {type: string}, status: { enum: [received, reading, done, failed] }, progress: { type: object, properties: { done: {type: integer}, total: {type: integer} } }, found: { type: array, items: { type: object } }, error: {type: string} } }
    Order:
      type: object
      properties:
        id: {type: string}
        month: {type: string}
        status: { enum: [picked, drafted, quoted, invoiced, closed] }
        composeUrl: { type: string, description: 'mailto: link to the bookshop with the order text filled in (never the card number: the text leaves it for the person to fill in)' }
        composeComplete: { type: boolean, description: 'false when the whole text would make the link too long for mail apps: the link then asks the person to paste composeText' }
        composeTo: { type: string, description: 'the bookshop''s address the link writes to (shown next to the link)' }
        composeSubject: {type: string}
        composeText: { type: string, description: 'the order text in full (only in the Compose answer)' }
        estimate: { $ref: '#/components/schemas/Money' }
        quoted: { $ref: '#/components/schemas/Money' }
        invoiced: { $ref: '#/components/schemas/Money' }
        lines: { type: array, items: { type: object, properties: { book: { $ref: '#/components/schemas/BookRef' }, for: {type: string}, estimate: { $ref: '#/components/schemas/Money' }, quoted: { $ref: '#/components/schemas/Money' }, delivery: {type: string}, state: { enum: [planned, quoted, unavailable, delivered, rolled_over] } } } }
    Settings:
      type: object
      properties:
        budget: { allOf: [ { $ref: '#/components/schemas/Budget' } ], description: 'one shared monthly budget (centimes, 0 to 1,000,000, min ≤ max); admins set it; no rollover' }
        adultPicks: {type: integer}
        newAuthorsOnly: {type: boolean}
        ai: { type: object, properties: { provider: { enum: [claude, ollama, none], description: 'ollama for a new household; claude only by explicit opt-in' }, model: {type: string}, ollamaUrl: {type: string}, leaves: { type: array, readOnly: true, items: {type: string}, description: 'what leaves the server with this provider, shown before opting in' }, jobs: { type: object, properties: { read: {type: boolean}, link: {type: boolean}, suggest: {type: boolean}, explain: {type: boolean}, wildcards: {type: boolean} } } } }
        person: { type: object, description: settings of the current person, properties: { mix: { enum: [deepen_connect, deepen_broaden, ai] }, unreadLimit: {type: integer}, counterpoints: {type: boolean}, takeaways: {type: boolean}, takeawaysToAi: { type: boolean, description: 'whether any AI (local or not) may read your takeaways; off unless you turn it on' }, fiction: {type: boolean}, weights: { type: object, additionalProperties: {type: number} } } }
        kidsThemes: { type: array, items: { type: object, properties: { theme: {type: string}, enabled: {type: boolean} } } }
