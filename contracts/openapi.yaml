openapi: 3.1.0
info:
  title: Philobiblos API
  version: 0.1.0
  description: |
    HTTP API of Philobiblos. Same under HomersLab and standalone. Authentication: HomersLab forwarded identity
    (`X-HomersLab-Person`, trusted only from the configured proxy address) or a standalone passkey session cookie.
    `/shares` also takes a per-person share token (`Authorization: Bearer`), which is good for nothing else.
    Secrets (tokens, the mail password, the delivery address) never appear in a response, except a new
    share token once, in the response that creates it. See ADR 0009 and docs/security.md.
    Money is in hundredths of the household's currency (integer; Me.money, Settings.money). Dates are ISO-8601.
servers: [{ url: /api }]
security: [ { homerslabPerson: [] }, { session: [] } ]
tags: [{name: auth}, {name: household}, {name: month}, {name: backlog}, {name: brain}, {name: library}, {name: inbox}, {name: orders}, {name: settings}, {name: system}]

paths:
  /health:
    get: { tags: [system], operationId: health, security: [], responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { ok: {type: boolean}, version: {type: string}, mode: {enum: [homerslab, standalone]} } } } } } } }

  /me:
    get: { tags: [system], operationId: me, responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Current person and household, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } } } }

  /auth/session:
    get: { tags: [auth], operationId: authSession, security: [], summary: 'Who is signed in, and whether the household still needs its first admin', responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } } } }
  /auth/enrol/options:
    post:
      tags: [auth]
      operationId: enrolOptions
      security: []
      summary: 'Standalone: start enrolling a passkey with a one-time link (the first admin''s setup link, or an invite)'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], additionalProperties: false, properties: { token: { type: string, maxLength: 200 }, name: { type: string, minLength: 1, maxLength: 60, description: 'setup links only: the first admin''s name' } } } } } }
      responses: { '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: WebAuthn registration options, content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnStart' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { description: 'The link is unknown, used or expired', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: 'Not in homerslab mode (Homeward signs people in)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '429': { description: Too many attempts, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /auth/enrol/verify:
    post:
      tags: [auth]
      operationId: enrolVerify
      security: []
      summary: 'Standalone: finish enrolling; signs the person in (sets the session cookie)'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnFinish' } } } }
      responses: { '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Signed in, headers: { Set-Cookie: { schema: { type: string }, description: 'philobiblos_session; HttpOnly; Secure; SameSite=Strict; Path=/' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { description: 'Verification failed, or the challenge expired', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'This passkey is already enrolled', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: Not in homerslab mode, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '429': { description: Too many attempts, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /auth/sign-in/options:
    post:
      tags: [auth]
      operationId: signInOptions
      security: []
      summary: 'Standalone: start a passkey sign-in (discoverable credentials; user verification required)'
      responses: { '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: WebAuthn authentication options, content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnStart' } } } }, '404': { description: Not in homerslab mode, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '429': { description: Too many attempts, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /auth/sign-in/verify:
    post:
      tags: [auth]
      operationId: signInVerify
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnFinish' } } } }
      responses: { '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Signed in, headers: { Set-Cookie: { schema: { type: string }, description: 'philobiblos_session; HttpOnly; Secure; SameSite=Strict; Path=/' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { description: 'Verification failed, an unknown passkey, or a kid''s account', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: Not in homerslab mode, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '429': { description: Too many attempts, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /auth/sign-out:
    post: { tags: [auth], operationId: signOut, security: [], summary: Ends this browser's session (if any) and clears the cookie, responses: { '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Signed out } } }

  /people:
    post:
      tags: [household]
      operationId: addPerson
      summary: 'Admins, standalone: add an adult, an admin or a kid (under HomersLab, people come from HomersLab)'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PersonInput' } } } }
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The handle is taken, or the household is managed by HomersLab', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /people/{personId}:
    parameters: [{ name: personId, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [household]
      operationId: editPerson
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PersonPatch' } } } }
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such person, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The last admin cannot stop being one; the handle is taken; or managed by HomersLab', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
    delete:
      tags: [household]
      operationId: removePerson
      summary: 'Admins, standalone: remove a person with their readings, passkeys and sessions'
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Removed }, '404': { description: No such person, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'Not yourself, not the last admin; or managed by HomersLab', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /people/{personId}/invites:
    parameters: [{ name: personId, in: path, required: true, schema: { type: string } }]
    post:
      tags: [household]
      operationId: invitePerson
      summary: 'Admins, standalone: a one-time link (7 days) for an adult''s first passkey; the link is in this response only. Needs a sign-in in the last 10 minutes (403 otherwise). People who have a passkey add more themselves (/me/passkeys/invite).'
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '201': { description: Created, content: { application/json: { schema: { type: object, required: [url, expiresAt], properties: { url: { type: string }, expiresAt: { type: string } } } } } }, '404': { description: No such person, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'Kids never sign in; the person already has a passkey; or managed by HomersLab', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /me/passkeys:
    get: { tags: [auth], operationId: myPasskeys, responses: { '404': { description: 'Not under HomersLab (Homeward holds the passkeys)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Passkey' } } } } } } }
  /me/passkeys/invite:
    post: { tags: [auth], operationId: inviteMyself, summary: 'Standalone: a one-time link (24 hours) to add a passkey on another device for yourself; the link is in this response only. Needs a sign-in in the last 10 minutes (403 otherwise).', responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '201': { description: Created, content: { application/json: { schema: { type: object, required: [url, expiresAt], properties: { url: { type: string }, expiresAt: { type: string } } } } } }, '404': { description: Not under HomersLab, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } } }
  /me/sessions/end:
    post: { tags: [auth], operationId: signOutEverywhere, summary: 'Standalone: ends every session of yours, this one too', responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Signed out everywhere }, '404': { description: Not under HomersLab, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } } }
  /me/passkeys/{id}:
    delete: { tags: [auth], operationId: removePasskey, summary: 'Removes one of your passkeys and ends the sessions it signed in', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Removed }, '404': { description: 'No such passkey of yours; or under HomersLab', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: Your last passkey stays, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } } }

  /month:
    get:
      tags: [month]
      operationId: getCurrentMonth
      summary: 'This month''s plan, in the household''s time zone (Settings.cycle.timezone): the one source of "this month" for the page and for add_to_month.'
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MonthPlan' } } } } }
  /month/{month}:
    parameters: [{ name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
    get:
      tags: [month]
      operationId: getMonth
      summary: 'This month or the next (or a month with an order): the picks (packages/scoring, spec §5), budget, the viewer''s focus and the order''s progress. Computed on each look until someone changes it; then kept as the month''s order.'
      responses: { '404': { description: 'Not this month or the next (changes); no plan for that month (a look)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MonthPlan' } } } } }
  /month/{month}/budget:
    parameters: [{ name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
    put:
      tags: [month]
      operationId: setMonthBudget
      summary: 'Admins: this month only (null goes back to the household''s budget). The adults'' picks stay; the kids'' are made again within the range.'
      requestBody: { required: true, content: { application/json: { schema: { oneOf: [ { type: object, required: [min, max], additionalProperties: false, properties: { min: { $ref: '#/components/schemas/Money' }, max: { $ref: '#/components/schemas/Money' } } }, { type: 'null' } ] } } } }
      responses: { '404': { description: 'Not this month or the next (changes); no plan for that month (a look)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The bookshop has the order already', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Recomputed plan, content: { application/json: { schema: { $ref: '#/components/schemas/MonthPlan' } } } } }
  /month/{month}/picks:
    parameters: [{ name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
    post:
      tags: [month]
      operationId: changePicks
      summary: 'Add or remove picks (your own and the kids''; another adult''s: 403), or start again from the scoring (recompute). A change after Compose needs Compose again.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, minProperties: 1, properties: { add: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/PickRef' } }, remove: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/PickRef' } }, recompute: { type: boolean } } } } } }
      responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: 'No open candidate for that person and book; or not this month or the next', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The bookshop has the order already', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MonthPlan' } } } } }

  /backlog:
    get:
      tags: [backlog]
      operationId: listBacklog
      summary: 'GitHub-style filtered list (grammar in contracts/backlog-query.md), scored by packages/scoring. The backlog is shared: every adult sees every candidate.'
      parameters:
        - { name: q, in: query, schema: { type: string, default: 'is:open sort:score' }, example: 'is:open is:adult move:deepen price:<30 sort:score' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '400': { description: 'A q over 500 characters or a limit outside 1 to 200 (bad qualifiers are queryErrors, not 400)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [items, counts, facets, nextCursor, queryErrors], properties: {
            items: { type: array, items: { $ref: '#/components/schemas/Candidate' } },
            counts: { type: object, properties: { open: {type: integer}, closed: {type: integer} } },
            facets: { type: object, additionalProperties: { type: array, items: { type: object, properties: { value: {type: string}, count: {type: integer} } } } },
            nextCursor: { type: [string, 'null'] },
            queryErrors: { type: array, items: { type: string } } } } } }
    post:
      tags: [backlog]
      operationId: addToBacklog
      summary: 'A book by hand, for yourself or a kid (adults act for kids); another adult''s backlog is theirs (403)'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title], additionalProperties: false, properties: { title: { type: string, maxLength: 300 }, author: { type: string, maxLength: 200 }, isbn13: { type: string, pattern: '^97[89]\d{10}$' }, for: { type: string, description: 'a handle, or me (the default)' } } } } } }
      responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No one has that handle, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: Already in that backlog, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Candidate' } } } } }
  /backlog/bulk:
    post:
      tags: [backlog]
      operationId: bulkBacklog
      summary: 'All or nothing, on your own candidates and the kids'' (403 if any is another adult''s). add_to_month adds them to this month''s picks (up to 50).'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids, action], properties: { ids: { type: array, minItems: 1, maxItems: 200, items: {type: string} }, action: { enum: [not_for_me, snooze, reopen, add_to_month] }, months: { type: integer, minimum: 1, maximum: 24, default: 3 } } } } } }
      responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such candidate or person, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: object, required: [changed], properties: { changed: {type: integer} } } } } } }
  /backlog/saved-filters:
    get: { tags: [backlog], operationId: savedFilters, responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { id: {type: string}, name: {type: string}, q: {type: string} } } } } } } } }
    post: { tags: [backlog], operationId: saveFilter, summary: 'Saves one of your filters (your list starts from the defaults; at most 20)', requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, q], additionalProperties: false, properties: { name: { type: string, maxLength: 40 }, q: { type: string, maxLength: 500 } } } } } }, responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: Twenty saved already, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '201': { description: Created } } }

  /backlog/saved-filters/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, maxLength: 100 } }]
    patch: { tags: [backlog], operationId: renameFilter, summary: 'Renames one of your saved filters (a default too: your list starts from them)', requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], additionalProperties: false, properties: { name: { type: string, maxLength: 40 } } } } } }, responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such saved filter of yours, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Renamed } } }
    delete: { tags: [backlog], operationId: removeFilter, summary: 'Removes one of your saved filters (an empty list shows the defaults again)', responses: { '404': { description: No such saved filter of yours, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Removed } } }

  /people/{personId}/brain:
    parameters: [{ name: personId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [brain]
      operationId: getBrain
      summary: 'An adult''s ideas (read books per layer, the best open candidate per layer) and the edges between ideas. Every adult may look; kids have an emotional map instead (404).'
      responses: { '404': { description: 'No such person, or a kid', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Ideas, layers, edges, content: { application/json: { schema: { $ref: '#/components/schemas/Brain' } } } } }
  /proposals:
    get:
      tags: [brain]
      operationId: listProposals
      summary: 'Links and book ideas waiting for a person''s decision (book ideas on a merged idea show its new name and keep their own idea id for the review). A proposal written from someone''s takeaways is theirs alone: nobody else sees it here (philobiblos#3).'
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Proposals' } } } } }
  /links/{fromBook}/{toBook}:
    parameters: [{ name: fromBook, in: path, required: true, schema: {type: string} }, { name: toBook, in: path, required: true, schema: {type: string} }]
    put:
      tags: [brain]
      operationId: reviewLink
      summary: 'A person confirms or rejects a link (the reviewer is recorded). One written from someone''s takeaways is theirs alone: for anyone else it does not exist (404).'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [state], additionalProperties: false, properties: { state: { enum: [confirmed, rejected] } } } } } }
      responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such link, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: object, required: [state, reason], properties: { state: { enum: [confirmed, rejected] }, reason: {type: string} } } } } } }
  /books/{bookId}/ideas/{ideaId}:
    parameters: [{ name: bookId, in: path, required: true, schema: {type: string} }, { name: ideaId, in: path, required: true, schema: {type: string} }]
    put:
      tags: [brain]
      operationId: reviewBookIdea
      summary: 'A person confirms or rejects a book''s idea, or moves it to another layer (which confirms it). Same privacy as links.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, minProperties: 1, additionalProperties: false, properties: { state: { enum: [confirmed, rejected] }, layer: { $ref: '#/components/schemas/Layer' } } } } } }
      responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such idea on that book, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: object, required: [state, layer], properties: { state: { enum: [confirmed, rejected] }, layer: { $ref: '#/components/schemas/Layer' } } } } } } }
  /idea-proposals/{proposalId}:
    parameters: [{ name: proposalId, in: path, required: true, schema: {type: string} }]
    put:
      tags: [brain]
      operationId: reviewIdeaProposal
      summary: 'A person confirms a new idea the AI proposed for a book (it becomes an idea, or the existing one of that name, with the book confirmed in it), moves it to another layer (which confirms it), or rejects it (no idea is made). Same privacy as links; 409 once decided.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, minProperties: 1, additionalProperties: false, properties: { state: { enum: [confirmed, rejected] }, layer: { $ref: '#/components/schemas/Layer' } } } } } }
      responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such proposal, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: Already decided, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: object, required: [state, layer], properties: { state: { enum: [confirmed, rejected] }, layer: { $ref: '#/components/schemas/Layer' }, idea: { type: object, required: [id, name], properties: { id: {type: string}, name: {type: string} } } } } } } } }
  /ideas/{ideaId}:
    parameters: [{ name: ideaId, in: path, required: true, schema: {type: string} }]
    patch:
      tags: [brain]
      operationId: editIdea
      summary: 'Rename an idea, or merge it into another (the household''s shared vocabulary, ADR 0005): either name or mergeInto. Any adult may merge; a merge changes no book''s rows (it decides nothing, private proposals stay their owner''s) and is logged for an admin''s undo.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, minProperties: 1, maxProperties: 1, additionalProperties: false, properties: { name: { type: string, minLength: 1, maxLength: 60 }, mergeInto: {type: string} } } } } }
      responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such idea, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: Another idea has that name, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: 'The idea (after a merge, the one it went into)', content: { application/json: { schema: { type: object, required: [id, name], properties: { id: {type: string}, name: {type: string} } } } } } }
  /ideas/merges:
    get:
      tags: [brain]
      operationId: listMerges
      summary: 'The merge log, newest first: which idea went into which, who merged it and when, and whether it was undone'
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, required: [id, idea, into, mergedBy, mergedAt, undone], properties: { id: {type: string}, idea: { $ref: '#/components/schemas/IdeaRef' }, into: { $ref: '#/components/schemas/IdeaRef' }, mergedBy: { type: [string, 'null'] }, mergedAt: {type: string}, undone: {type: boolean} } } } } } } }
  /ideas/merges/{mergeId}/undo:
    parameters: [{ name: mergeId, in: path, required: true, schema: {type: string} }]
    post:
      tags: [brain]
      operationId: undoMerge
      summary: 'Admins: undo a merge (the idea stands on its own again, with the ideas the merge re-pointed). A merge never changed a row, so nothing else needs restoring.'
      responses: { '404': { description: No such merge, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'Already undone, or the idea has been merged again since', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: The idea, content: { application/json: { schema: { $ref: '#/components/schemas/IdeaRef' } } } } }

  /people/{personId}/library:
    parameters: [{ name: personId, in: path, required: true, schema: { type: string } }]
    get: { tags: [library], operationId: getLibrary, summary: 'A person''s library: owned books of their audience and every book they have a status for. Another adult''s takeaways are never included.', responses: { '404': { description: No such person, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Library' } } } } } }
  /people/{personId}/reading/{bookId}:
    parameters: [{ name: personId, in: path, required: true, schema: {type: string} }, { name: bookId, in: path, required: true, schema: {type: string} }]
    put:
      tags: [library]
      operationId: setReading
      summary: 'Your own status and takeaway, or a kid''s status and feedback (adults act for kids). Not another adult''s (403).'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReadingUpdate' } } } }
      responses: { '400': { description: 'Bad request: a takeaway for a kid, feedback for an adult, or an invalid value', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such person or book, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Reading' } } } } }

  /inbox:
    get:
      tags: [inbox]
      operationId: getInbox
      summary: 'What waits for a person: their own shares and AI suggestions (each person''s own), and the household''s mail that needs a person: lines that matched no book (notBook lines too), mail that failed closed or waits for the media worker, and mail that was not verified (one item for all of it: a count and the commonest reasons, nothing of any content). Decided and dismissed items drop out. Paged.'
      parameters: [{ name: filter, in: query, schema: { enum: [all, ai, shared, mail] } }, { name: cursor, in: query, schema: { type: string, maxLength: 600 }, description: 'nextCursor of the page before' }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }]
      responses: { '400': { description: 'Unknown filter, a cursor that is not one, or a limit out of range', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: 'A page, newest first; unverified mail is one item (m_unverified) on the first page', content: { application/json: { schema: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/InboxItem' } }, nextCursor: { type: [string, 'null'] } } } } } } }
  /inbox/{itemId}/books/{index}:
    parameters: [{ name: itemId, in: path, required: true, schema: {type: string} }, { name: index, in: path, required: true, schema: {type: integer} }]
    post:
      tags: [inbox]
      operationId: decideFound
      summary: 'Add or skip one book of an item (its found[].index). Add, for `for` (a handle or `me`: yourself or a kid, never another adult): a share''s or a quote''s or shop line''s book goes to their backlog; an invoice line''s book becomes copies (owned; at most 20; its order line delivered) and, for someone named, goes on their to-read pile. The book is the one the line names (EAN, then title and author) or a new one. A notBook line, an eanUnreadable one, or one without a title can only be skipped. Once decided, decided.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [action], additionalProperties: false, properties: { action: { enum: [add, skip] }, for: { type: string, maxLength: 40 } } } } } }
      responses: { '400': { description: 'Bad request: not a book, no title, or an invalid body', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: 'No such item or book (or another adult''s share)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: Decided already, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: 'The item as it is now', content: { application/json: { schema: { $ref: '#/components/schemas/InboxItem' } } } } }
  /inbox/{itemId}/dismiss:
    parameters: [{ name: itemId, in: path, required: true, schema: {type: string} }]
    post:
      tags: [inbox]
      operationId: dismissInboxItem
      summary: 'Takes a whole item out of the Inbox (a share of yours, a mail that failed closed or was not verified, the rest of a mail''s lines). Nothing else changes; the mail stays in mail_seen.'
      responses: { '404': { description: 'No such item (or another adult''s share)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'A mailed invoice that may be one typed in: it is answered (POST /inbox/{itemId}/typed), never dismissed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Dismissed } }
  /inbox/{itemId}/typed:
    parameters: [{ name: itemId, in: path, required: true, schema: {type: string} }]
    post:
      tags: [inbox]
      operationId: answerTypedInvoice
      summary: 'Any adult (the bookshop''s mail is the household''s): the answer to an item of kind maybe_typed_invoice (philobiblos#45), a verified mailed invoice held because its books, quantities and books'' total are those of an invoice typed in or imported in the 30 days before it was read with no number, or with its number for no shop or another (so nothing counted them once). same: the mail counts as the typed one and nothing else changes; another: another purchase, so the mail''s effect now (its copies owned at the price paid, the price learnt, its order lines delivered and invoiced). Once; the item is gone after it.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [answer], properties: { answer: { enum: [same, another] } } } } } }
      responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such item, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The item asks nothing about a typed invoice, or it is answered already', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: 'The item as it is now', content: { application/json: { schema: { $ref: '#/components/schemas/InboxItem' } } } } }
  /shares:
    post:
      tags: [inbox]
      operationId: createShare
      security: [ { homerslabPerson: [] }, { session: [] }, { shareToken: [] } ]
      summary: 'Phone share target (the PWA''s share_target through its service worker, or an iOS Shortcut with a per-person share token). Images (JPEG, PNG, WebP, GIF) and videos (MP4, MOV, WebM: H.264, HEVC, VP8 or VP9, up to 180 s), by their bytes. The media worker re-encodes each image, and takes a frame every ~2 s (at most 30) from each video, before anything is kept; only those JPEGs are kept, never a video or its sound, and the originals are deleted once read. 30 shares per person per 10 minutes.'
      requestBody:
        content:
          multipart/form-data: { schema: { type: object, properties: { url: {type: string, maxLength: 2000}, text: {type: string, maxLength: 5000}, title: {type: string, maxLength: 300}, note: {type: string, maxLength: 2000}, media: { type: array, items: { type: string, format: binary } } } } }
      responses: { '400': { description: 'Nothing to share, a field too long, or not multipart', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '202': { description: Accepted, content: { application/json: { schema: { type: object, required: [id, status], properties: { id: {type: string}, status: { enum: [received, reading, done] } } } } } }, '413': { description: 'Too many files (more than 30), an image over 20 MB, a video over 64 MB, or over 100 MB together', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '415': { description: 'A file that is not a JPEG, PNG, WebP or GIF image or an MP4, MOV or WebM video by its bytes', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '429': { description: Too many shares or failed tokens; wait, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '503': { description: 'Media processing is unavailable here (no media worker): a share without files still works', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /share-tokens:
    get: { tags: [inbox], operationId: listShareTokens, summary: The current person's share tokens (never the token itself), responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShareToken' } } } } } } }
    post:
      tags: [inbox]
      operationId: createShareToken
      summary: 'A new share token for the current person; the token is in this response only, and stored hashed. At most 10 live tokens a person.'
      requestBody: { content: { application/json: { schema: { type: object, required: [label], properties: { label: {type: string, maxLength: 60} } } } } }
      responses: { '409': { description: Ten live tokens already; revoke one first, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '201': { description: Created, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ShareToken' }, { type: object, required: [token], properties: { token: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}[A-Za-z0-9_-]{43}$', description: 'the token''s id, then 256 random bits' } } } ] } } } } }
  /share-tokens/{id}:
    delete: { tags: [inbox], operationId: revokeShareToken, parameters: [{ name: id, in: path, required: true, schema: {type: string} }], responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '204': { description: Revoked } } }
  /push/subscriptions:
    get: { tags: [settings], operationId: listPushSubscriptions, summary: 'Your own devices that get notifications (the endpoint is never answered)', responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PushSubscription' } } } } } } }
    post:
      tags: [settings]
      operationId: addPushSubscription
      summary: 'This browser''s subscription (PushSubscription.toJSON()), for you: https at a browser''s push service, a P-256 key and a 16-byte secret; at most 10 a person (409); the same endpoint moves to you; 10 saves in 10 minutes'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [endpoint, keys], additionalProperties: false, properties: { endpoint: { type: string, maxLength: 1024 }, expirationTime: { type: [number, 'null'] }, keys: { type: object, required: [p256dh, auth], additionalProperties: false, properties: { p256dh: { type: string }, auth: { type: string } } } } } } } }
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'At most 10 devices a person', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '429': { description: Too many saves, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '503': { description: 'No usable sealing key', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '201': { description: Saved, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } } }
  /push/subscriptions/{id}:
    delete: { tags: [settings], operationId: removePushSubscription, parameters: [{ name: id, in: path, required: true, schema: {type: string} }], responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: 'Not one of yours', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '204': { description: Removed } } }
  /push/test:
    post: { tags: [settings], operationId: testPush, summary: 'A test notification to your own devices (3 in 10 minutes); its text is the service worker''s own', responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { description: Too many tests, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '200': { description: Sent (or why not), content: { application/json: { schema: { type: object, properties: { status: { enum: [done, blocked, failed] }, detail: { type: string } } } } } } } }
  /connectors:
    get: { tags: [settings], operationId: listConnectors, summary: 'Admins: the bookshop connectors (connectors/<id>/connector.yaml, the ones that ship and the household''s own), what each allows, whether it is enabled, and why one cannot be used', responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: object, required: [connectors], properties: { connectors: { type: array, items: { $ref: '#/components/schemas/Connector' } } } } } } } } }
  /connectors/{connectorId}:
    put: { tags: [settings], operationId: setConnector, summary: 'Admins: enable a connector for the version Settings showed (with a sign-in of the last 10 minutes, standalone), or turn it off. Nothing a connector names (senders, its price host) counts until it is enabled, and only for that version of its file.', parameters: [{ name: connectorId, in: path, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [enabled], properties: { enabled: { type: boolean }, acceptVersion: { type: string, description: 'the version Settings showed; needed to enable' } } } } } }, responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such connector, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The connector cannot be used, changed since Settings showed it, shares a mail domain with an enabled one, or its currency is not the household''s', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Connector' } } } } } }
  /mail/oauth/start:
    post: { tags: [settings], operationId: startMailOAuth, summary: 'Admins, with a sign-in of the last 10 minutes (standalone; refused under HomersLab until its edge sends a recent sign-in): connect the mailbox with XOAUTH2 (PHILOBIBLOS_IMAP_AUTH=xoauth2, the admin''s own OAuth client; docs/mail-providers.md). Answers the provider''s authorization URL (authorization code, PKCE S256, a state used once within 10 minutes by this session), whose redirect URI is always PHILOBIBLOS_ORIGIN + /settings/mail-oauth.', requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [accept], properties: { accept: { type: string, pattern: '^[0-9a-f]{64}$', description: 'Settings.mail.oauth.allowsVersion of what the admin read' } } } } } }, responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The mailbox signs in with a password, no sealing key, or what connecting allows changed since Settings showed it', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '200': { description: 'Where to send the admin', content: { application/json: { schema: { type: object, required: [authorizeUrl], properties: { authorizeUrl: { type: string, format: uri } } } } } } } }
  /mail/oauth/finish:
    post: { tags: [settings], operationId: finishMailOAuth, summary: 'Admins: what the provider sent back to /settings/mail-oauth, from the session that started it, within 10 minutes. The code is exchanged with its PKCE verifier; the refresh and access tokens are sealed (never in an answer). The provider''s refusal (error) is reported by its RFC 6749 code only.', requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [state], properties: { state: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }, code: { type: string, maxLength: 4096 }, error: { type: string, maxLength: 200 } } } } } }, responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '400': { description: 'Not a state this session started (or used, or older than 10 minutes), or the provider did not allow it', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The OAuth client or the mailbox changed since the start, or no sealing key', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '502': { description: 'The token endpoint refused the code, gave no refresh token, or could not be reached', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '200': { description: Connected, content: { application/json: { schema: { $ref: '#/components/schemas/MailSettings' } } } } } }
  /mail/oauth:
    delete: { tags: [settings], operationId: disconnectMailOAuth, summary: 'Admins: forget the mailbox''s tokens, then revoke the refresh token at the provider (RFC 7009) when the client names a revocation endpoint. Only narrows: no fresh sign-in needed.', responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { description: 'The mailbox signs in with a password', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '200': { description: Forgotten, content: { application/json: { schema: { type: object, required: [revoked], properties: { revoked: { type: [boolean, 'null'], description: 'true: the provider confirmed; false: it did not (or the tokens were for another client, and were not sent); null: no revocation endpoint, remove the app at the provider' } } } } } } } }
  /push/key:
    get: { tags: [settings], operationId: pushKey, summary: 'Web Push: the household''s application server key (VAPID, P-256), public half only, for PushManager.subscribe; made and sealed the first time', responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '503': { description: 'No usable sealing key, or one that does not open the sealed notification key (nothing is replaced or removed): no notifications', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '200': { description: OK, content: { application/json: { schema: { type: object, required: [publicKey], properties: { publicKey: { type: string, description: 'base64url, 65 bytes uncompressed' } } } } } } } }
    delete: { tags: [settings], operationId: resetPushKey, summary: 'Admins, with a sign-in of the last 10 minutes (standalone): a new notification key. The sealed key and every device are removed together; each adult turns notifications on again. For a deliberate sealing-key change, or a key someone may have seen.', responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Removed, content: { application/json: { schema: { type: object, required: [devices], properties: { devices: { type: integer, description: 'devices removed' } } } } } } } }
  /shares/{id}:
    get: { tags: [inbox], operationId: getShare, summary: 'A share of yours: its progress through the media worker and what was found. Another adult''s answers 404.', parameters: [{ name: id, in: path, required: true, schema: {type: string} }], responses: { '404': { description: No such share, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Progress and result, content: { application/json: { schema: { $ref: '#/components/schemas/Share' } } } } } }

  /orders:
    post:
      tags: [orders]
      operationId: createOrderDraft
      summary: 'Turn the month''s picks into an order and its Compose link, a mailto with the text filled in (Philobiblos never sends mail; the text asks for a quote and never holds a card number). The month defaults to the current one. With list: true (no-shop mode, philobiblos#27), the order as a plain list for any shop or none instead: its mail text to no recipient, without the delivery address (listUrl, listText), and its CSV at /orders/{id}/list.csv; it needs no bookshop address and opens nothing sealed.'
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, properties: { month: { type: string, pattern: '^\d{4}-\d{2}$' }, list: { type: boolean, description: 'the plain list instead of the mail to the bookshop' } } } } } }
      responses: { '404': { description: 'Not this month or the next (changes); no plan for that month (a look)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'No bookshop address yet (Compose), nothing picked, the bookshop has the order already, or a book of it is in the library already (a tap)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } } }
  /orders/shops:
    get: { tags: [orders], operationId: listOrderShops, summary: 'Any adult: the enabled bookshop connectors (id and name only) an invoice typed in may name as its shop', responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: object, required: [shops], properties: { shops: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } } } } } } } } } }
  /orders/entries:
    post:
      tags: [orders]
      operationId: recordOrderEntry
      summary: 'Any adult: an order''s quote or an invoice typed in (lines) or imported from a CSV (csv), for any shop or none (philobiblos#27). It has the effects a verified mail of its kind has, and only those: an invoice''s copies owned at the price paid (source manual), the line of the composed order each book was ordered in delivered and that order invoiced, a book nobody has added (for yourself or a kid: on their pile); a quote''s lines of the month''s composed order (drafted or quoted) quoted or unavailable, and the order quoted. Amounts in hundredths of the household''s currency (a CSV''s as written, 18.90). An invoice number counts once per shop, typed, imported or read from that shop''s connector''s mail. Kept: book ids, quantities, amounts, the number and who recorded it, never the text typed. dryRun answers what it would do and changes nothing.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderEntry' } } } }
      responses: { '400': { description: 'Bad request (a row it cannot read names its row number)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: 'No order that month (a quote); no one with that handle', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The household has no currency yet; the order is not with a bookshop (picked) or is past its quote; that shop''s invoice number counts already', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '200': { description: 'A dry run: what the entry would do', content: { application/json: { schema: { $ref: '#/components/schemas/OrderEntryResult' } } } }, '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/OrderEntryResult' } } } } }
    get:
      tags: [orders]
      operationId: listOrderEntries
      summary: 'Any adult: the invoices typed in or imported in the last 7 days (philobiblos#45), newest first, at most 50: when, the number and shop, the total, how many copies, who recorded it, and whether you may undo it (canUndo: you recorded it or are an admin, and it was recorded since undo exists; whether nothing has changed since is answered by the undo).'
      responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { type: object, required: [entries], properties: { entries: { type: array, items: { $ref: '#/components/schemas/OrderEntrySummary' } } } } } } } }
  /orders/entries/{id}/undo:
    parameters: [{ name: id, in: path, required: true, schema: {type: string} }]
    post:
      tags: [orders]
      operationId: undoOrderEntry
      summary: 'Whoever recorded it, or an admin, within 7 days (philobiblos#45): an invoice typed in or imported undone, while nothing has changed it since: its copies removed, a tap''s copy it took the tap''s again, the order lines it delivered as they were (a line whose book was bought again since by one invoice of no order, as many copies, passes to that purchase and stays delivered, the order invoiced for it; two such purchases or another quantity is 409), each order''s invoiced total less what it added (with none left, the order as before its first invoice), a price it learnt put back unless another invoice changed it since, a pile it put a book on left without it unless that book was touched since, and the entry gone (its number may be typed again). A book it added stays. Refused (409, nothing changed) once a copy, a line or an order it changed has changed, or a bookshop''s mail counts as it or waits in the Inbox as maybe it; a quote is corrected by typing it again, never undone.'
      responses: { '403': { description: 'A kid, another origin, or another adult than whoever recorded it (and not an admin)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: No such entry, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'A quote; recorded more than 7 days ago, or before undo existed; something it changed has changed since; a bookshop''s mail counts as it', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '204': { description: Undone } }
  /orders/{id}/list.csv:
    get: { tags: [orders], operationId: getOrderList, summary: 'Any adult: the plain list of a composed order (not picked) as a CSV to download (text/csv, an attachment, never cached): the books still to buy (planned or quoted), a row each with isbn, title, author (the first), qty 1, an empty price and the estimate, the columns an invoice imported reads (POST /orders/entries; estimate is named back), so the same file with the prices paid records what was bought. No delivery address and no one''s name. A cell a spreadsheet would run as a formula (starting =, +, -, @, their full-width forms, or a tab or CR) is written with a leading quote (philobiblos#45), which the import reads back.', parameters: [{ name: id, in: path, required: true, schema: {type: string} }], responses: { '404': { description: No such order, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The order is only picked: the list is not made yet', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: 'The CSV (UTF-8 with a byte order mark, CRLF)', content: { text/csv: { schema: { type: string } } } } } }
  /orders/{id}/lines/{bookId}:
    put: { tags: [orders], operationId: markOwned, summary: 'Any adult: a book of a composed order bought with no invoice to record, marked owned by a tap (owned: true): one copy (source manual, of this order, priced as the shop quoted it or not at all; no price learnt) and the line delivered; only a planned or quoted line, so a second tap is 409. owned: false undoes a tap (its copy removed, the line as it was); a line an invoice or the Inbox delivered is never undone here (409). An invoice of the book that comes after a tap takes the tap''s copy (never a second) and ends its undo. While a line is delivered the picks stay as they are.', parameters: [{ name: id, in: path, required: true, schema: {type: string} }, { name: bookId, in: path, required: true, schema: {type: string} }], requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [owned], properties: { owned: { type: boolean } } } } } }, responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '404': { description: 'No such order, or no such book in it', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'The order is only picked; the line is unavailable or delivered already (owned), or was not marked owned here (undo)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } } } }
  /orders/{id}:
    get: { tags: [orders], operationId: getOrder, parameters: [{ name: id, in: path, required: true, schema: {type: string} }], responses: { '404': { description: No such order, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } } } }

  /settings:
    get: { tags: [settings], operationId: getSettings, responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } } } }
    patch: { tags: [settings], operationId: patchSettings, summary: '`person` (your own settings) is stored, and the household''s `budget`, `order`, `ai`, `cycle` and `money` (admins, 403 for others); the other household parts answer 400 until their screens store them. `order` and a Claude key need the sealing key (409 without it); a currency other than an enabled connector''s is 409. All or nothing.', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }, responses: { '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '409': { description: 'No sealing key (for the addresses or a Claude key), or a currency an enabled connector does not use', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: OK } } }
  /jobs/{job}/run:
    post: { tags: [system], operationId: runJob, description: 'Admins only. prices, metadata, covers, mail and shares (the media worker''s queue of shared images and videos, then the AI reading them) run now in the background (job_run keeps how it went); ai_suggest (suggestions to each adult''s Inbox), ai_tag (ideas, links and repeats proposed for backlog books without ideas) and ai_explain (the why of this month''s kept picks) run through the AI provider in Settings; monthly is the monthly refresh (spec §5 step 1: mail, shares, prices, the month''s plan kept, ai_suggest, ai_explain), which also runs by itself on the household''s day (Settings.cycle), once a month, and then notifies the adults (Web Push, /push); by hand it does every step again for this month and notifies no one.', parameters: [{ name: job, in: path, required: true, schema: { enum: [monthly, mail, shares, prices, metadata, covers, ai_suggest, ai_tag, ai_explain] } }, { name: again, in: query, required: false, schema: { enum: ['true', 'false'] }, description: 'metadata: look up every book again, not only those never looked up' }], responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '202': { description: Started, content: { application/json: { schema: { type: object, properties: { id: { type: string, description: 'the job_run row' } } } } } }, '409': { description: 'That job is running already', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } } }

components:
  securitySchemes:
    homerslabPerson: { type: apiKey, in: header, name: X-HomersLab-Person, description: 'PHILOBIBLOS_MODE=homerslab: the person id forwarded by the HomersLab proxy, with X-HomersLab-Name and X-HomersLab-Role (admin, adult or kid); all three are trusted only from PHILOBIBLOS_TRUSTED_PROXY' }
    session: { type: apiKey, in: cookie, name: philobiblos_session, description: 'PHILOBIBLOS_MODE=standalone: the session cookie of a passkey sign-in. Requests that change something must also carry an Origin header equal to PHILOBIBLOS_ORIGIN. Until 0.2.0 the old name, shelf_session, is read too (when this one is absent) and moved to this one.' }
    shareToken: { type: http, scheme: bearer, description: 'A per-person phone share token: accepted by POST /shares and nothing else' }
  responses:
    Unauthorized: { description: 'No valid identity for this route (deny by default)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: 'Not allowed: a kid (kids have no access), someone HomersLab sends without a role, a non-admin on an admin route, or a request that changes something from another origin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error: { type: object, required: [error], properties: { error: {type: string} } }
    Connector:
      type: object
      description: 'A bookshop as data (contracts/connectors.md). It allows nothing until an admin enables it, for this version of its file.'
      required: [id, name, origin, version, usable, enabled, changed]
      properties:
        id: { type: string }
        name: { type: string }
        origin: { enum: [builtin, local], description: 'builtin: ships with Philobiblos; local: PHILOBIBLOS_CONNECTORS_DIR' }
        version: { type: string, description: 'SHA-256 of its file; enabling names it' }
        usable: { type: boolean }
        problem: { type: string, description: 'why it cannot be used (the file does not follow the connector schema, say)' }
        enabled: { type: boolean }
        changed: { type: boolean, description: 'enabled for an earlier version of its file: it allows nothing until enabled again' }
        currency: { type: string, description: 'what its amounts are in (ISO 4217); it counts only while that is the household''s currency (Settings.money)' }
        enableBlocked: { type: string, description: 'why an admin cannot enable it now although it is usable: the household''s currency is another or not chosen yet, or (under HomersLab) enabling waits for the edge''s recent sign-in' }
        language: { type: string }
        allows:
          type: object
          required: [mailFrom, signedBy, quoteSenders, priceHost, orderTo, markup]
          properties:
            mailFrom: { type: array, items: { type: string }, description: 'the From domains whose mail counts (exact)' }
            signedBy: { type: array, items: { type: string }, description: 'the DKIM signing domains that count (exact)' }
            quoteSenders: { type: array, items: { type: string } }
            priceHost: { type: [string, 'null'], description: 'the one host its price lookup asks (added to the egress allowlist)' }
            orderTo: { type: [string, 'null'], description: 'where Compose writes unless Settings names another address' }
            markup: { type: boolean, description: 'schema.org Order and Invoice markup (JSON-LD) in its signed mail counts: an order''s lines are kept, an invoice makes copies' }
    Money: { type: integer, description: 'hundredths of the household''s currency (HouseholdMoney)' }
    Me: { type: object, properties: { person: { $ref: '#/components/schemas/Person' }, household: { type: array, items: { $ref: '#/components/schemas/Person' } }, mode: { enum: [homerslab, standalone] }, money: { $ref: '#/components/schemas/HouseholdMoney' } } }
    HouseholdMoney:
      type: object
      required: [currency, unknownPrice]
      description: 'The household''s money (philobiblos#27): every amount (Money) is in hundredths of its currency. No currency is assumed.'
      properties:
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$', description: 'ISO 4217, one this server knows; null until chosen (PHILOBIBLOS_CURRENCY at a start fills in a household that has none, or an admin here). A connector counts only in it, and it does not change while a connector in another is enabled (409); amounts are never converted.' }
        unknownPrice: { allOf: [ { $ref: '#/components/schemas/Money' } ], description: 'what a price nobody knows counts as in the month and the scores (ADR 0008): 0 to 1,000,000, default 2500' }
    Person: { type: object, required: [id, name, role], properties: { id: {type: string}, name: {type: string}, role: { enum: [admin, adult, kid] }, handle: { type: [string, 'null'] }, birthYear: { type: [integer, 'null'], description: kids only }, ageBand: { enum: ['0-2','3-5','6-8','9-12', null] }, signsIn: { type: boolean, description: 'standalone: has at least one passkey' } } }
    PersonInput: { type: object, required: [name, role], additionalProperties: false, properties: { name: { type: string, minLength: 1, maxLength: 60 }, role: { enum: [admin, adult, kid] }, handle: { type: string, pattern: '^[a-z][a-z0-9-]{0,19}$' }, birthYear: { type: integer, minimum: 2000, maximum: 2100 } } }
    PersonPatch: { type: object, additionalProperties: false, properties: { name: { type: string, minLength: 1, maxLength: 60 }, role: { enum: [admin, adult, kid] }, handle: { type: [string, 'null'], pattern: '^[a-z][a-z0-9-]{0,19}$' }, birthYear: { type: [integer, 'null'], minimum: 2000, maximum: 2100 } } }
    AuthSession: { type: object, required: [mode, signedIn, setupNeeded], properties: { mode: { enum: [homerslab, standalone] }, signedIn: {type: boolean}, setupNeeded: { type: boolean, description: 'standalone: no admin has a passkey yet; the setup link is in PHILOBIBLOS_DATA_DIR/setup-link.txt' }, person: { $ref: '#/components/schemas/Person' } } }
    WebAuthnStart: { type: object, required: [challengeId, options], properties: { challengeId: {type: string}, options: { type: object, description: 'PublicKeyCredentialCreationOptionsJSON or PublicKeyCredentialRequestOptionsJSON' }, person: { type: object, properties: { name: {type: string} }, description: 'enrol: who the link is for' } } }
    WebAuthnFinish: { type: object, required: [challengeId, response], additionalProperties: false, properties: { challengeId: { type: string, maxLength: 100 }, response: { type: object, description: 'RegistrationResponseJSON or AuthenticationResponseJSON' }, label: { type: string, maxLength: 40, description: 'enrol: a name for this passkey, e.g. Laptop' } } }
    Passkey: { type: object, required: [id, label, createdAt], properties: { id: {type: string}, label: {type: string}, createdAt: {type: string}, lastUsedAt: { type: [string, 'null'] }, backedUp: {type: boolean}, invitedBy: { type: [string, 'null'], description: 'the name of the admin whose invite made it; null for your own or the setup link' } } }
    Budget: { type: object, properties: { min: { $ref: '#/components/schemas/Money' }, max: { $ref: '#/components/schemas/Money' } } }
    BookRef: { type: object, required: [id, title], properties: { id: {type: string}, title: {type: string}, authors: { type: array, items: {type: string} }, coverUrl: {type: string}, isbn13: {type: string}, isFiction: {type: boolean}, audience: { enum: [adult, kids] } } }
    Move: { enum: [deepen, connect, broaden, counterpoint, wildcard, intro, fiction] }
    ScorePart: { type: object, properties: { label: {type: string}, value: {type: number}, kind: {type: string} } }
    Candidate:
      type: object
      properties:
        id: {type: string}
        book: { $ref: '#/components/schemas/BookRef' }
        for: { $ref: '#/components/schemas/Person' }
        state: { enum: [open, closed] }
        closedReason: { enum: [not_for_me, snoozed, owned, repeats, picked, null] }
        move: { $ref: '#/components/schemas/Move' }
        ideas: { type: array, items: { type: object, properties: { id: {type: string}, name: {type: string}, layer: { enum: [intro, core, deep, counterpoint] } } } }
        theme: { type: [string, 'null'] }
        buildsOn: { type: array, items: { type: object, properties: { book: { $ref: '#/components/schemas/BookRef' }, reason: {type: string}, confidence: {type: number}, state: { enum: [proposed, confirmed] } } } }
        source: { enum: [wishlist, to_buy, share, ai, manual, seed] }
        addedAt: { type: string, format: date-time }
        price: { $ref: '#/components/schemas/Money' }
        priceIsEstimate: {type: boolean}
        score: { type: number, description: 'absent when excluded (an adult candidate over the price limit)' }
        scoreParts: { type: array, items: { $ref: '#/components/schemas/ScorePart' } }
    PickRef: { type: object, required: [bookId, for], properties: { bookId: {type: string}, for: {type: string} } }
    Pick:
      type: object
      properties: { candidate: { $ref: '#/components/schemas/Candidate' }, move: { $ref: '#/components/schemas/Move' }, why: {type: string}, idea: {type: string} }
    MonthPlan:
      type: object
      properties:
        month: {type: string}
        budget: { $ref: '#/components/schemas/Budget' }
        budgetIsOverride: {type: boolean}
        total: { $ref: '#/components/schemas/Money' }
        adults: { type: array, items: { type: object, properties: { person: { $ref: '#/components/schemas/Person' }, picks: { type: array, items: { $ref: '#/components/schemas/Pick' } }, unreadPile: {type: integer}, unreadLimit: {type: integer} } } }
        kids: { type: array, items: { type: object, properties: { person: { $ref: '#/components/schemas/Person' }, picks: { type: array, items: { $ref: '#/components/schemas/Pick' } } } } }
        focus: { type: array, items: { type: object, properties: { move: { $ref: '#/components/schemas/Move' }, ideas: { type: array, items: {type: string} }, bookId: {type: string}, sentence: {type: string} } } }
        nextBroaden: { type: [object, 'null'], properties: { month: {type: string}, idea: {type: string}, bookId: {type: string} } }
        order: { oneOf: [ { $ref: '#/components/schemas/Order' }, { type: 'null' } ] }
    Layer: { enum: [intro, core, deep, counterpoint] }
    IdeaRef: { type: object, required: [id, name], properties: { id: {type: string}, name: {type: string} } }
    Proposals:
      type: object
      required: [links, ideas, newIdeas]
      properties:
        links: { type: array, items: { type: object, required: [from, to, reason, confidence, fromAi, onlyYou], properties: { from: { $ref: '#/components/schemas/BookRef' }, to: { $ref: '#/components/schemas/BookRef' }, reason: {type: string}, confidence: {type: number}, fromAi: {type: boolean}, onlyYou: { type: boolean, description: 'written from your own takeaways: nobody else sees it' } } } }
        ideas: { type: array, items: { type: object, required: [book, idea, layer, confidence, fromAi, onlyYou], properties: { book: { $ref: '#/components/schemas/BookRef' }, idea: { type: object, required: [id, name], properties: { id: {type: string}, name: {type: string} } }, layer: { $ref: '#/components/schemas/Layer' }, confidence: {type: number}, fromAi: {type: boolean}, onlyYou: { type: boolean, description: 'written from your own takeaways: nobody else sees it' } } } }
        newIdeas: { type: array, description: 'new ideas the AI proposed for a book: a name only, no idea exists until a person confirms one (PUT /idea-proposals/{id})', items: { type: object, required: [id, book, name, layer, confidence, fromAi, onlyYou], properties: { id: {type: string}, book: { $ref: '#/components/schemas/BookRef' }, name: {type: string}, layer: { $ref: '#/components/schemas/Layer' }, confidence: {type: number}, fromAi: {type: boolean}, onlyYou: { type: boolean, description: 'written from your own takeaways: nobody else sees it' } } } }
    Brain:
      type: object
      required: [ideas, edges]
      properties:
        ideas: { type: array, items: { type: object, required: [id, name, readCount, unreadOwned, isNew, layers], properties: { id: {type: string}, name: {type: string}, readCount: {type: integer}, unreadOwned: {type: integer}, isNew: {type: boolean}, focus: { $ref: '#/components/schemas/Move' },
          layers: { type: object, additionalProperties: { type: object, properties: { books: { type: array, items: { $ref: '#/components/schemas/BookRef' } }, next: { oneOf: [ { $ref: '#/components/schemas/BookRef' }, { type: 'null' } ] } } } } } } }
        edges: { type: array, items: { type: object, properties: { a: {type: string}, b: {type: string}, weight: {type: integer}, via: { type: array, items: {type: string} }, kind: { enum: [read, gap, focus, future] } } } }
    Reading: { type: object, properties: { status: { enum: [to_read, reading, read, abandoned] }, feedback: { enum: [loved, meh, not_yet, null] }, takeaway: { type: [string, 'null'], maxLength: 280 }, finishedAt: { type: [string, 'null'] } } }
    ReadingUpdate: { type: object, additionalProperties: false, properties: { status: { enum: [to_read, reading, read, abandoned] }, feedback: { enum: [loved, meh, not_yet, null] }, takeaway: { type: [string, 'null'], maxLength: 280 }, finishedAt: { type: [string, 'null'], pattern: '^\d{4}-\d{2}-\d{2}$' } } }
    Library:
      type: object
      required: [person, books, stats]
      properties:
        person: { $ref: '#/components/schemas/Person' }
        books: { type: array, items: { type: object, required: [book, reading], properties: { book: { $ref: '#/components/schemas/BookRef' }, reading: { $ref: '#/components/schemas/Reading' }, ideas: { type: array, items: {type: string} }, themes: { type: array, maxItems: 2, items: {type: string}, description: 'kids'' books: one or two themes (spec §3)' } } } }
        stats: { type: object, properties: { read: {type: integer}, reading: {type: integer}, unreadPile: {type: integer}, unreadLimit: {type: integer}, takeaways: {type: integer} } }
        themes: { type: array, items: { type: object, properties: { theme: {type: string}, books: {type: integer}, loved: {type: integer} } } }
    InboxItem:
      type: object
      required: [id, kind, title, createdAt, found]
      properties:
        id: {type: string}
        kind: { enum: [share, ai_suggestion, unmatched_invoice_line, unmatched_quote_line, unmatched_shop_line, mail_failed, mail_waiting, mail_unverified, maybe_typed_invoice] }
        by: { $ref: '#/components/schemas/Person' }
        title: { type: string, description: 'Philobiblos''s own words, or a share''s title, or a verified mail''s subject (safeField); plain text, never HTML' }
        createdAt: {type: string}
        mediaCount: {type: integer}
        share: { type: object, description: 'kind share', properties: { status: { enum: [received, reading, done, failed] }, progress: { type: object, properties: { done: {type: integer}, total: {type: integer} } }, refused: {type: integer}, url: { type: [string, 'null'] }, note: { type: [string, 'null'] }, aiNote: { type: [string, 'null'], description: 'what the AI could not read of it (images without a vision model, or nothing), Philobiblos''s words' } } }
        unverified: { type: object, description: 'kind mail_unverified: every unverified mail since the item was last dismissed', properties: { count: {type: integer}, reasons: { type: array, maxItems: 5, items: { type: object, properties: { reason: {type: string}, count: {type: integer} } } } } }
        typed: { type: object, description: 'kind maybe_typed_invoice: the invoice typed in or imported that this mailed one may be (its found are the mail''s books, to show: answered with POST /inbox/{itemId}/typed, never one by one)', required: [entryId, createdAt, number, shop, totalC], properties: { entryId: {type: string}, createdAt: {type: string}, number: { type: [string, 'null'] }, shop: { type: [string, 'null'] }, totalC: { $ref: '#/components/schemas/Money' }, by: { $ref: '#/components/schemas/Person' } } }
        mail: { type: object, description: 'mail kinds: what Philobiblos knows of it. An unverified mail has its reason only.', properties: { reason: { type: [string, 'null'] }, expected: { type: [string, 'null'], description: 'the kind the mail looked like (failed closed)' }, date: { type: [string, 'null'] }, number: { type: [string, 'null'], description: 'order or invoice number' } } }
        found:
          type: array
          items:
            type: object
            required: [index, decided]
            properties:
              index: { type: integer, description: 'the n of POST /inbox/{itemId}/books/{n}' }
              title: { type: [string, 'null'] }
              author: { type: [string, 'null'] }
              ean: { type: [string, 'null'] }
              notBook: { type: boolean, description: 'an EAN that is no ISBN (a toy, a game): skip only' }
              eanUnreadable: { type: boolean, description: 'an invoice row read whole but for its EAN: skip only' }
              qty: {type: integer}
              priceC: { type: [integer, 'null'] }
              verdict: { enum: [add, skip_off_theme, skip_owned, fiction] }
              idea: {type: string}
              layer: {type: string}
              theme: {type: string}
              buildsOn: { type: array, items: {type: string} }
              why: { type: string, description: 'kind ai_suggestion: the AI''s one line, plain text' }
              move: { $ref: '#/components/schemas/Move' }
              decided: { enum: [added, skipped, null] }
    Share: { type: object, required: [id, status, progress], properties: { id: {type: string}, status: { enum: [received, reading, done, failed] }, progress: { type: object, required: [done, total], properties: { done: {type: integer}, total: {type: integer} } }, refused: { type: integer, description: 'images the media worker refused' }, found: { type: array, items: { type: object, required: [title], properties: { title: {type: string}, author: { type: [string, 'null'] } } } }, error: { type: [string, 'null'] } } }
    OrderEntrySummary:
      type: object
      required: [id, createdAt, source, number, shop, total, copies, canUndo]
      properties:
        id: {type: string}
        createdAt: {type: string}
        source: { enum: [typed, csv] }
        number: { type: [string, 'null'] }
        shop: { type: [string, 'null'] }
        total: { $ref: '#/components/schemas/Money' }
        copies: {type: integer}
        by: { $ref: '#/components/schemas/Person' }
        canUndo: { type: boolean }
    Order:
      type: object
      properties:
        id: {type: string}
        month: {type: string}
        status: { enum: [picked, drafted, quoted, invoiced, closed] }
        composeUrl: { type: string, description: 'mailto: link to the bookshop with the order text filled in (never the card number, and no Cc or Bcc: the person adds the card number in their own mail app)' }
        composeComplete: { type: boolean, description: 'false when the whole text would make the link too long for mail apps: the link then asks the person to paste composeText' }
        composeTo: { type: string, description: 'the bookshop''s address the link writes to (shown next to the link)' }
        composeSubject: {type: string}
        composeText: { type: string, description: 'the order text in full (only in the Compose answer)' }
        listUrl: { type: string, description: 'no-shop mode (list: true): a mailto: to no recipient with the list''s text, without the delivery address; the person picks the shop in their own mail app' }
        listComplete: { type: boolean, description: 'as composeComplete, for listUrl' }
        listSubject: {type: string}
        listText: { type: string, description: 'the list''s mail text in full (only in the list''s answer): the books, no delivery address, no card line' }
        estimate: { $ref: '#/components/schemas/Money' }
        quoted: { $ref: '#/components/schemas/Money' }
        invoiced: { $ref: '#/components/schemas/Money' }
        lines: { type: array, items: { type: object, properties: { book: { $ref: '#/components/schemas/BookRef' }, for: {type: string}, estimate: { $ref: '#/components/schemas/Money' }, quoted: { $ref: '#/components/schemas/Money' }, delivery: {type: string}, state: { enum: [planned, quoted, unavailable, delivered, rolled_over] }, ownedByTap: { type: boolean, description: 'delivered by a tap (PUT /orders/{id}/lines/{bookId}), which can still be undone' } } } }
    OrderEntry:
      type: object
      additionalProperties: false
      required: [kind]
      description: 'lines or csv, one of them. A quote names its month; an invoice may have a number and a date.'
      properties:
        kind: { enum: [quote, invoice] }
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: 'a quote: the month of the composed order it answers' }
        number: { type: string, maxLength: 40, description: 'an invoice''s number (letters, digits, spaces, . / _ -; no run of 12 digits): counted once per shop, whatever its case' }
        shop: { type: string, maxLength: 80, description: 'an invoice''s shop: an enabled connector''s id (GET /orders/shops; its mail of the same number then counts once with this entry), or the household''s own label for a shop without one' }
        date: { type: string, format: date, description: 'an invoice: the day it was bought (today by default)' }
        lines: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/OrderEntryLine' } }
        csv: { type: string, maxLength: 65536, description: 'A CSV (comma, semicolon or tab; RFC 4180 quoting; at most 100 rows, 20 columns, 1,000 characters a cell): a header row naming isbn (isbn13, ean), title, author, qty (quantity), price, available and for, in any order and case, then a row a book. Other columns are ignored and named back. price is an amount such as 18.90; available yes or no.' }
        dryRun: { type: boolean }
    OrderEntryLine:
      type: object
      additionalProperties: false
      description: 'A book by its isbn (ISBN-13 or ISBN-10, the check digit holding) or its title (and author). A quote line has no qty and no for; an invoice line no available.'
      properties:
        isbn: { type: string, maxLength: 40 }
        title: { type: string, maxLength: 300 }
        author: { type: string, maxLength: 200 }
        qty: { type: integer, minimum: 1, maximum: 20, description: 'an invoice: copies (1 by default)' }
        price: { allOf: [ { $ref: '#/components/schemas/Money' } ], description: 'an invoice: paid for each copy; a quote: the shop''s price, none when unavailable' }
        available: { type: boolean, description: 'a quote: false when the shop cannot deliver it' }
        for: { type: string, maxLength: 40, description: 'an invoice: whose pile it goes on, me or a kid''s handle (never another adult''s)' }
    OrderEntryResult:
      type: object
      required: [kind, source, dryRun, number, shop, total, lines, ignoredColumns]
      properties:
        id: { type: string, description: 'the entry kept (none in a dry run)' }
        kind: { enum: [quote, invoice] }
        source: { enum: [typed, csv] }
        dryRun: { type: boolean }
        month: { type: string }
        orderId: { type: string, description: 'a quote''s order' }
        number: { type: [string, 'null'] }
        shop: { type: [string, 'null'] }
        total: { $ref: '#/components/schemas/Money' }
        ignoredColumns: { type: array, items: { type: string }, description: 'CSV columns it does not read (their cells never read)' }
        lines:
          type: array
          items:
            type: object
            required: [row, bookId, new, title, authors, isbn13, qty, price, available, for]
            properties:
              row: { type: integer }
              bookId: { type: [string, 'null'], description: 'null in a dry run for a book it would add' }
              new: { type: boolean, description: 'a book nobody had: added' }
              title: { type: string }
              authors: { type: array, items: { type: string } }
              isbn13: { type: [string, 'null'] }
              qty: { type: [integer, 'null'] }
              price: { type: [integer, 'null'] }
              available: { type: boolean }
              for: { type: [string, 'null'] }
    Settings:
      type: object
      properties:
        money: { allOf: [ { $ref: '#/components/schemas/HouseholdMoney' } ], description: 'admins change it; either part alone (a currency cannot be set back to null)' }
        budget: { allOf: [ { $ref: '#/components/schemas/Budget' } ], description: 'one shared monthly budget (hundredths of the household''s currency, 0 to 1,000,000, min ≤ max); admins set it; no rollover' }
        adultPicks: {type: integer}
        newAuthorsOnly: {type: boolean}
        ai:
          type: object
          description: 'The AI plugin (contracts/ai-plugin.md); admins change it. Ollama is the default and nothing leaves the home network with it; Claude is an opt-in that needs its API key and acceptLeaves (the leavesVersion of the list read) in the same request.'
          properties:
            provider: { enum: [claude, ollama, none], description: 'ollama for a new household; claude only by explicit opt-in' }
            model: { type: string, description: 'Ollama''s text model' }
            visionModel: { type: [string, 'null'], description: 'Ollama''s model for shared images; without one, shares are read by their captions only' }
            claudeModel: { type: string, description: 'Claude''s model id (default claude-opus-5-5)' }
            ollamaUrl: { type: string, readOnly: true, description: 'OLLAMA_URL, from the server''s environment only' }
            ollamaConfigured: { type: boolean, readOnly: true }
            claudeApiKey: { type: [string, 'null'], writeOnly: true, description: 'sealed like the delivery address (a key outside the database); never sent back. null removes it (and turns Claude off)' }
            hasClaudeKey: { type: boolean, readOnly: true }
            acceptLeaves: { type: string, pattern: '^[0-9a-f]{64}$', writeOnly: true, description: 'the leavesVersion of the list the admin read and accepts (400 when what leaves after this request is another list); needed to turn Claude on, to turn on a job that sends more while it is on, and again whenever the list holds a line not accepted (leavesAccepted false)' }
            leavesVersion: { type: string, readOnly: true, description: 'the version of leavesWithClaude, which acceptLeaves carries' }
            leaves: { type: array, readOnly: true, items: {type: string}, description: 'what leaves the server with this provider (empty for Ollama and none)' }
            leavesWithClaude: { type: array, readOnly: true, items: {type: string}, description: 'what would leave with Claude and these jobs, shown before opting in: built from the fields each job''s requests may hold' }
            dailyLimit: { type: integer, minimum: 10000, maximum: 20000000, description: 'the household''s allowance with Claude: tokens (input and output) in any 24 hours, every run together (default 200000); a call that could go past it is not made and its job stops as blocked' }
            usedToday: { type: integer, readOnly: true, description: 'tokens Claude counted in the last 24 hours' }
            leavesAccepted: { type: boolean, readOnly: true, description: 'Claude is on and an admin accepted every line of leaves; while false Claude is not called' }
            jobs: { type: object, properties: { read: {type: boolean}, link: {type: boolean}, suggest: {type: boolean}, explain: {type: boolean}, wildcards: {type: boolean} } }
        person: { type: object, description: settings of the current person, properties: { mix: { enum: [deepen_connect, deepen_broaden, ai] }, unreadLimit: {type: integer}, counterpoints: {type: boolean}, takeaways: {type: boolean}, takeawaysToAi: { type: boolean, description: 'whether any AI (local or not) may read your takeaways; off unless you turn it on' }, fiction: {type: boolean}, weights: { type: object, additionalProperties: {type: number} } } }
        kidsThemes: { type: array, items: { type: object, properties: { theme: {type: string}, enabled: {type: boolean} } } }
        cycle:
          type: object
          description: 'When the monthly refresh runs by itself (admins set it): the household''s day, time and time zone. Once a month, whatever restarts or clocks do; a month missed while the server was off is not made up.'
          properties:
            day: { type: integer, minimum: 1, maximum: 28 }
            time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
            timezone: { type: string, maxLength: 64, description: 'an IANA time zone, e.g. Europe/Zurich: the household''s one zone, for the refresh and for "this month" everywhere (the plan, /month, add_to_month). PHILOBIBLOS_TZ is only its value at the first start.' }
            next: { type: string, format: date-time, readOnly: true, description: 'when it next runs (or is tried again)' }
            last: { type: object, readOnly: true, properties: { period: { type: string, description: 'YYYY-MM' }, status: { enum: [running, retry, done, gave_up] }, attempts: { type: integer } } }
            problem: { type: string, readOnly: true, description: 'the stored time zone is not one this server knows: nothing runs until an admin sets it again (next is then absent)' }
            futureRun: { type: string, readOnly: true, description: 'YYYY-MM: a run was recorded for a month later than now''s, so the clock was ahead when it ran (or is behind now). It does not stop the month it is now; the month it names runs again when it comes.' }
        order: { type: object, description: 'Where orders go (admins set it): both sealed at rest with a key outside the database (docs/security.md)', properties: { bookshopEmail: { type: [string, 'null'] }, deliveryAddress: { type: [string, 'null'], maxLength: 300, writeOnly: true, description: 'never sent back; only in a Compose text' }, hasDelivery: { type: boolean, readOnly: true }, canSeal: { type: boolean, readOnly: true, description: 'false under HomersLab without PHILOBIBLOS_SEALING_KEY' }, needsReentry: { type: boolean, readOnly: true, description: 'the key is usable but the rows were sealed under another (rotated): an admin enters both addresses again' }, keyProblem: { enum: [missing, unreadable], readOnly: true, description: 'the server''s key configuration is wrong (canSeal false): the addresses are kept; fix PHILOBIBLOS_SEALING_KEY' } } }
        mail: { $ref: '#/components/schemas/MailSettings' }
    MailSettings:
      type: object
      readOnly: true
      description: 'The IMAP mailbox that receives only the forwarded bookshop mail (ADR 0007), from the environment: its app password or its OAuth tokens are never in the API'
      properties:
        host: {type: string}
        port: { type: integer, default: 993, description: 'TLS from the first byte, whatever the port' }
        user: {type: string}
        folder: { type: string, default: INBOX }
        configured: { type: boolean }
        auth: { enum: [password, xoauth2], description: 'password: an app password (the default); xoauth2: a token from the admin''s OAuth client, connected here (docs/mail-providers.md)' }
        oauth:
          type: object
          description: 'With xoauth2 only'
          required: [redirectUri, allows, allowsVersion, connected, needsReconnect, revocable]
          properties:
            redirectUri: { type: string, description: 'PHILOBIBLOS_ORIGIN + /settings/mail-oauth: the one redirect URI to register with the provider' }
            allows: { type: array, items: {type: string}, description: 'what connecting allows, shown before an admin connects' }
            allowsVersion: { type: string, description: 'what POST /mail/oauth/start must carry as accept' }
            connected: { type: boolean }
            connectedAt: { type: string, format: date-time }
            needsReconnect: { type: boolean, description: 'tokens are kept that are not used: for another client or mailbox (the environment changed), or sealed under another key' }
            revocable: { type: boolean, description: 'the client names a revocation endpoint' }
            connectBlocked: { type: string, description: 'why an admin cannot connect now (no sealing key; HomersLab''s missing recent sign-in)' }
    PushSubscription: { type: object, required: [id, service, createdAt], properties: { id: {type: string}, service: { type: string, description: 'the push service''s host name' }, createdAt: {type: string}, lastSentAt: { type: [string, 'null'] } } }
    ShareToken: { type: object, required: [id, label, createdAt], properties: { id: {type: string}, label: {type: string}, createdAt: {type: string}, lastUsedAt: { type: [string, 'null'] }, revoked: {type: boolean} } }
