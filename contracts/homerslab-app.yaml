# HomersLab catalog manifest (shape to align with HomersLab's feedstock format when it is final)
id: shelf
name: Shelf
tagline: Decide what to read next, and order it within your family's budget
category: Books
icon: icon.svg
version: 0.1.0
image: ghcr.io/<owner>/shelf:0.1.0@sha256:<digest>   # placeholders until the first release; scripts/check-release.sh refuses them
ports: [{ container: 8080, protocol: http, public: false }]
volumes: [{ name: data, mount: /data, backup: true, description: SQLite database, covers, share media }]
env:
  SHELF_MODE: homerslab
  SHELF_DATA_DIR: /data
  SHELF_TZ: Europe/Zurich
  # Shelf refuses to start in homerslab mode without both (ADR 0010):
  SHELF_EDGE_IDENTITY: homerslab-v1        # HomersLab's promise, once its edge does it (HomersLab #236): the edge deletes
                                           # every X-HomersLab-* header a client sends and sets the three below itself
  SHELF_TRUSTED_PROXY: ${EDGE_ADDRESS}     # the edge's address on the app network; only it may reach Shelf's port
                                           # (HomersLab ADR 0020's per-app firewall makes the address mean something)
identity:
  # All three are trusted only from SHELF_TRUSTED_PROXY; a person is added to Shelf the first time HomersLab sends
  # them, with exactly the role HomersLab sends (admin | adult | kid; anything else: 403), and their name and role
  # follow HomersLab on every request.
  forwarded_header: X-HomersLab-Person     # stable person id
  forwarded_name_header: X-HomersLab-Name
  forwarded_role_header: X-HomersLab-Role  # admin | adult | kid
  household_api: true                      # later: kids' birth years (not yet defined by HomersLab)
audience: adults                           # adults full access; kids: no access (adults act for them)
secrets:
  - { key: SHELF_SEALING_KEY, file: true, description: Key that seals the delivery address (outside the database) }
  - { key: SHELF_IMAP_PASSWORD, optional: true, description: App password of the Shelf-only mailbox (IMAP over TLS, read-only) }
  - { key: ANTHROPIC_API_KEY, optional: true, description: Claude provider, only after an explicit opt-in in Settings }
config:
  - { key: SHELF_ORIGIN, description: "The app's address (https://…), set by HomersLab: WebAuthn's origin and the Origin every change must carry" }
  - { key: SHELF_IMAP_HOST, optional: true, description: IMAP host of the Shelf-only mailbox (port 993, TLS only) }
  - { key: SHELF_IMAP_USER, optional: true, description: Its user name }
  - { key: OLLAMA_URL, optional: true, description: The local Ollama (the default AI provider) }
network:
  # Enforced by Shelf's own HTTP client as well (ADR 0009): nothing else is reachable from the app.
  egress: [www.orellfuessli.ch, openlibrary.org, covers.openlibrary.org, '${SHELF_IMAP_HOST}:993', '${OLLAMA_URL}']
  optional_egress: [api.anthropic.com]
  optional_egress_note: api.anthropic.com only when the household opts in to Claude in Settings; with Ollama nothing leaves for AI.
health: /api/health
resources: { memory: 512Mi, cpu: 0.5 }
