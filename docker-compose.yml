# Standalone: mkdir data keys work, docker compose up -d, then open the link in data/setup-link.txt to make the first admin's
# passkey (published on this machine only, ADR 0009; sign-in, ADR 0010).
# Back up data/ as you like; keys/ holds the key that seals the addresses (docs/security.md): keep its copy apart
# (a password manager, say), never in the same backup as data/.
# From Shelf (the app's old name, philobiblos#30): the services are now philobiblos and philobiblos-worker, so start this
# file with `docker compose up -d --remove-orphans`, which stops the old shelf containers (two servers or two workers must
# never share data/ and work/). data/, keys/ and work/ stay where they are, the database still data/shelf.sqlite.
# A .env with SHELF_* names still works until 0.2.0; rename them to PHILOBIBLOS_* (PHILOBIBLOS_* wins when both are set).
services:
  philobiblos:
    image: ${PHILOBIBLOS_IMAGE:-${SHELF_IMAGE:-philobiblos:0.1.0}}
    build: .
    user: "${PHILOBIBLOS_UID:-${SHELF_UID:-1000}}:${PHILOBIBLOS_GID:-${SHELF_GID:-1000}}"
    environment:
      PHILOBIBLOS_MODE: standalone
      # The address you open; passkeys are bound to it (https, or http://localhost). See ADR 0010.
      PHILOBIBLOS_ORIGIN: ${PHILOBIBLOS_ORIGIN:-${SHELF_ORIGIN:-http://localhost:${PHILOBIBLOS_PORT:-${SHELF_PORT:-8080}}}}
      PHILOBIBLOS_DATA_DIR: /data
      PHILOBIBLOS_KEYS_DIR: /keys
      PHILOBIBLOS_WORK_DIR: /work
      # The household's time zone at the first start only; Settings holds it after.
      PHILOBIBLOS_TZ: Europe/Zurich
      # The household's currency (ISO 4217) for a household that has none yet; empty: an admin chooses it in Settings.
      PHILOBIBLOS_CURRENCY: ${PHILOBIBLOS_CURRENCY:-}
      # The household's locale (BCP 47, e.g. en-GB, de-CH): the order letter's language when the shop's connector names none
      # Philobiblos writes, and the delivery-address filter's common words (locales/). Empty: English.
      PHILOBIBLOS_LOCALE: ${PHILOBIBLOS_LOCALE:-}
      # AI: Ollama is the default; Claude only after the opt-in in Settings.
      OLLAMA_URL: ${OLLAMA_URL:-}
      # off: nothing leaves (prices, Open Library and covers stay as they are); docs/security.md
      PHILOBIBLOS_EGRESS: ${PHILOBIBLOS_EGRESS:-${SHELF_EGRESS:-on}}
      # A reverse proxy in front of Philobiblos (its address, or a range of at most /24 or /64; comma-separated): only its
      # X-Forwarded-For names the client, for join links' home network (docs/security.md). Empty: the connection's address.
      PHILOBIBLOS_TRUSTED_PROXY: ${PHILOBIBLOS_TRUSTED_PROXY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Mail (ADR 0007): the Philobiblos-only mailbox, read over IMAP (TLS from the first byte) with an app password, or
      # with XOAUTH2 for a provider that refuses passwords (PHILOBIBLOS_IMAP_AUTH=xoauth2: your own OAuth client, then
      # connected by an admin in Settings). Which to use for your provider: docs/mail-providers.md.
      PHILOBIBLOS_IMAP_HOST: ${PHILOBIBLOS_IMAP_HOST:-${SHELF_IMAP_HOST:-}}
      PHILOBIBLOS_IMAP_USER: ${PHILOBIBLOS_IMAP_USER:-${SHELF_IMAP_USER:-}}
      PHILOBIBLOS_IMAP_PASSWORD: ${PHILOBIBLOS_IMAP_PASSWORD:-${SHELF_IMAP_PASSWORD:-}}
      # Or a file holding it (mount it read-only, e.g. under /run/secrets): as for the OAuth client's secret below.
      PHILOBIBLOS_IMAP_PASSWORD_FILE: ${PHILOBIBLOS_IMAP_PASSWORD_FILE:-${SHELF_IMAP_PASSWORD_FILE:-}}
      PHILOBIBLOS_IMAP_FOLDER: ${PHILOBIBLOS_IMAP_FOLDER:-${SHELF_IMAP_FOLDER:-INBOX}}
      # A self-hosted server or a local bridge: its port (TLS from the first byte all the same) and its own certificate
      # (mount it read-only and name it here); empty: 993 and the system's CAs. A mail bridge that listens on its own
      # loopback needs this service to share its network (network_mode): docs/mail-providers.md.
      PHILOBIBLOS_IMAP_PORT: ${PHILOBIBLOS_IMAP_PORT:-}
      PHILOBIBLOS_IMAP_CA_FILE: ${PHILOBIBLOS_IMAP_CA_FILE:-}
      PHILOBIBLOS_IMAP_AUTH: ${PHILOBIBLOS_IMAP_AUTH:-password}
      PHILOBIBLOS_IMAP_OAUTH_CLIENT_ID: ${PHILOBIBLOS_IMAP_OAUTH_CLIENT_ID:-}
      PHILOBIBLOS_IMAP_OAUTH_CLIENT_SECRET: ${PHILOBIBLOS_IMAP_OAUTH_CLIENT_SECRET:-}
      PHILOBIBLOS_IMAP_OAUTH_CLIENT_SECRET_FILE: ${PHILOBIBLOS_IMAP_OAUTH_CLIENT_SECRET_FILE:-}
      PHILOBIBLOS_IMAP_OAUTH_AUTHORIZE_URL: ${PHILOBIBLOS_IMAP_OAUTH_AUTHORIZE_URL:-}
      PHILOBIBLOS_IMAP_OAUTH_TOKEN_URL: ${PHILOBIBLOS_IMAP_OAUTH_TOKEN_URL:-}
      PHILOBIBLOS_IMAP_OAUTH_REVOKE_URL: ${PHILOBIBLOS_IMAP_OAUTH_REVOKE_URL:-}
      PHILOBIBLOS_IMAP_OAUTH_SCOPE: ${PHILOBIBLOS_IMAP_OAUTH_SCOPE:-}
      # Whose ARC seal vouches for a forward that broke the bookshop's DKIM: your own mail provider's sealing domain, if
      # you forward through one (docs/connectors.md lists common ones). None by default: no provider is assumed.
      PHILOBIBLOS_MAIL_ARC_SEALERS: ${PHILOBIBLOS_MAIL_ARC_SEALERS:-${SHELF_MAIL_ARC_SEALERS:-}}
      # Your own bookshop connectors (docs/connectors.md): add "./connectors:/connectors:ro,Z" to volumes and set this to
      # /connectors. Each waits for an admin to enable it in Settings.
      PHILOBIBLOS_CONNECTORS_DIR: ${PHILOBIBLOS_CONNECTORS_DIR:-}
      # The household's addresses the bookshop writes to (comma-separated); mail to anyone else is not taken.
      PHILOBIBLOS_MAIL_RECIPIENTS: ${PHILOBIBLOS_MAIL_RECIPIENTS:-${SHELF_MAIL_RECIPIENTS:-}}
    # work/ is shared with the media worker (:z, shared label): in/ the server's, out/ the worker's; only jobs in flight.
    volumes: [ "./data:/data:Z", "./keys:/keys:Z", "./work:/work:z" ]
    ports: [ "127.0.0.1:${PHILOBIBLOS_PORT:-${SHELF_PORT:-8080}}:8080" ]
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    restart: unless-stopped
  # The media worker (ADR 0009): decodes shared images, covers and invoice PDFs, the hostile files, away from the server.
  # No network at all, a read-only root, no capabilities, memory and process limits (768 MB bounds what the child's
  # 256 MB heap does not: ArrayBuffers, libvips); it sees only work/in and work/out.
  # Its own user (PHILOBIBLOS_WORKER_UID: never PHILOBIBLOS_UID, never 0) in Philobiblos's group: it reads work/in (read-only) and writes only
  # work/out, which it cannot replace (its parent is the image's read-only /work). The server makes both at start.
  philobiblos-worker:
    image: ${PHILOBIBLOS_IMAGE:-${SHELF_IMAGE:-philobiblos:0.1.0}}
    user: "${PHILOBIBLOS_WORKER_UID:-${SHELF_WORKER_UID:-61000}}:${PHILOBIBLOS_GID:-${SHELF_GID:-1000}}"
    command: [ "node", "/app/worker/dist/main.js" ]
    environment:
      PHILOBIBLOS_WORK_DIR: /work
    volumes: [ "./work/in:/work/in:ro,z", "./work/out:/work/out:z" ]
    depends_on: { philobiblos: { condition: service_healthy } }
    network_mode: none
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 64
    cpus: 1.0
    healthcheck: { disable: true }
    restart: unless-stopped
  # Optional local AI (the default provider), pinned by digest:
  # ollama:
  #   image: ollama/ollama:0.40.12@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b
  #   volumes: [ "./ollama:/root/.ollama" ]
