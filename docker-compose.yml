# Standalone: mkdir data keys work, docker compose up -d, then open the link in data/setup-link.txt to make the first admin's
# passkey (published on this machine only, ADR 0009; sign-in, ADR 0010).
# Back up data/ as you like; keys/ holds the key that seals the addresses (docs/security.md): keep its copy apart
# (a password manager, say), never in the same backup as data/.
services:
  shelf:
    image: ${SHELF_IMAGE:-shelf:0.1.0}
    build: .
    user: "${SHELF_UID:-1000}:${SHELF_GID:-1000}"
    environment:
      SHELF_MODE: standalone
      # The address you open; passkeys are bound to it (https, or http://localhost). See ADR 0010.
      SHELF_ORIGIN: ${SHELF_ORIGIN:-http://localhost:${SHELF_PORT:-8080}}
      SHELF_DATA_DIR: /data
      SHELF_KEYS_DIR: /keys
      SHELF_WORK_DIR: /work
      SHELF_TZ: Europe/Zurich
      # AI: Ollama is the default; Claude only after the opt-in in Settings.
      OLLAMA_URL: ${OLLAMA_URL:-}
      # off: nothing leaves (prices, Open Library and covers stay as they are); docs/security.md
      SHELF_EGRESS: ${SHELF_EGRESS:-on}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Mail (ADR 0007): the Shelf-only mailbox, read over IMAP (TLS) with an app password.
      SHELF_IMAP_HOST: ${SHELF_IMAP_HOST:-}
      SHELF_IMAP_USER: ${SHELF_IMAP_USER:-}
      SHELF_IMAP_PASSWORD: ${SHELF_IMAP_PASSWORD:-}
    # work/ is shared with the media worker (:z, shared label): in/ the server's, out/ the worker's; only jobs in flight.
    volumes: [ "./data:/data:Z", "./keys:/keys:Z", "./work:/work:z" ]
    ports: [ "127.0.0.1:${SHELF_PORT:-8080}:8080" ]
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    restart: unless-stopped
  # The media worker (ADR 0009): decodes shared images, covers and invoice PDFs, the hostile files, away from the server.
  # No network at all, a read-only root, no capabilities, memory and process limits (768 MB bounds what the child's
  # 256 MB heap does not: ArrayBuffers, libvips); it sees only work/in and work/out.
  # Its own user (SHELF_WORKER_UID: never SHELF_UID, never 0) in Shelf's group: it reads work/in (read-only) and writes only
  # work/out, which it cannot replace (its parent is the image's read-only /work). The server makes both at start.
  shelf-worker:
    image: ${SHELF_IMAGE:-shelf:0.1.0}
    user: "${SHELF_WORKER_UID:-61000}:${SHELF_GID:-1000}"
    command: [ "node", "/app/worker/dist/main.js" ]
    environment:
      SHELF_WORK_DIR: /work
    volumes: [ "./work/in:/work/in:ro,z", "./work/out:/work/out:z" ]
    depends_on: { shelf: { condition: service_healthy } }
    network_mode: none
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 64
    cpus: 1.0
    healthcheck: { disable: true }
    restart: unless-stopped
  # Optional local AI (the default provider), pinned by digest:
  # ollama:
  #   image: ollama/ollama:0.40.12@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b
  #   volumes: [ "./ollama:/root/.ollama" ]
